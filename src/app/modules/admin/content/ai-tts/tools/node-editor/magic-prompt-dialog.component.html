<div class="p-0 min-w-[500px] max-w-[800px] bg-white rounded-lg flex flex-col max-h-[90vh]">
    <div class="flex items-center justify-between mb-4 p-6 pb-0 shrink-0">
        <div class="flex items-center text-indigo-600">
            <mat-icon class="mr-2 icon-size-6">auto_fix_high</mat-icon>
            <span class="text-xl font-semibold tracking-tight">Magic Prompt</span>
        </div>
        <button mat-icon-button (click)="cancel()">
            <mat-icon class="icon-size-5">close</mat-icon>
        </button>
    </div>

    <div class="px-6 py-4 overflow-y-auto flex-1 space-y-5">
        <div class="text-sm text-gray-600">
            Hãy nhập thêm yêu cầu, dán văn bản hoặc hình ảnh để AI viết lại prompt chi tiết và chuyên nghiệp hơn.
        </div>

        <div class="space-y-2">
            <label class="text-sm font-medium text-gray-700">Yêu cầu bổ sung của bạn (tùy chọn)</label>
            <textarea
                [(ngModel)]="userInstruction"
                placeholder="VD: Mô tả ánh sáng lung linh, phong cách anime..."
                rows="3"
                class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm resize-none"></textarea>
        </div>

        <div class="space-y-2">
            <label class="text-sm font-medium text-gray-700">Hình ảnh tham khảo (tùy chọn)</label>
            <div *ngIf="!imageBase64" 
                 class="border-2 border-dashed border-gray-300 rounded-md p-6 flex flex-col items-center justify-center cursor-pointer hover:bg-gray-50 transition-colors"
                 onclick="document.getElementById('magicImageUpload').click()">
                <mat-icon class="text-gray-400 mb-2">cloud_upload</mat-icon>
                <span class="text-sm text-gray-500">Click để tải ảnh lên</span>
                <input id="magicImageUpload" type="file" accept="image/*" class="hidden" (change)="onFileSelected($event)">
            </div>
            
            <div *ngIf="imageBase64" class="relative inline-block border border-gray-200 rounded-md overflow-hidden">
                <img [src]="imageBase64" class="h-32 object-contain bg-gray-50">
                <button (click)="removeImage()" class="absolute top-1 right-1 bg-white/80 hover:bg-red-50 text-gray-600 hover:text-red-500 rounded-full w-6 h-6 flex items-center justify-center transition-colors">
                    <mat-icon class="icon-size-4">close</mat-icon>
                </button>
            </div>
        </div>

        <div class="space-y-2">
            <div class="flex items-center justify-between">
                <label class="text-sm font-medium text-gray-700">Prompt hiện tại / Kết quả</label>
                <button *ngIf="generatedPrompt" (click)="generatedPrompt = ''" class="text-xs text-indigo-600 hover:underline">
                    Hoàn tác
                </button>
            </div>
            <textarea
                [(ngModel)]="generatedPrompt ? generatedPrompt : currentPrompt"
                rows="6"
                class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-gray-50"></textarea>
        </div>
    </div>

    <div class="p-4 px-6 border-t border-gray-100 flex items-center justify-end space-x-3 shrink-0 bg-gray-50 rounded-b-lg">
        <button mat-button (click)="cancel()" class="text-gray-600 hover:bg-gray-200">
            Đóng
        </button>
        <button mat-stroked-button color="primary" 
                (click)="generate()" 
                [disabled]="isGenerating || (!userInstruction && !imageBase64)"
                class="border-indigo-200 text-indigo-600 hover:bg-indigo-50 min-w-[120px]">
            <mat-icon class="icon-size-4 mr-1" *ngIf="!isGenerating">auto_fix_high</mat-icon>
            <mat-icon class="icon-size-4 mr-1 animate-spin" *ngIf="isGenerating">autorenew</mat-icon>
            {{ isGenerating ? 'Đang tạo...' : 'Tạo Prompt' }}
        </button>
        <button mat-flat-button color="primary" 
                (click)="apply()" 
                [disabled]="!generatedPrompt && !currentPrompt"
                class="bg-indigo-600 text-white min-w-[100px]">
            Áp dụng
        </button>
    </div>
</div>
