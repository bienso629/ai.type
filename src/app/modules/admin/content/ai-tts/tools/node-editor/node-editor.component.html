<div class="w-full h-full relative overflow-auto hide-scrollbar bg-gray-50 select-none" #workspace (mousedown)="onWorkspaceMouseDown($event)" (wheel)="onWheel($event)">
    <!-- Huge canvas for native scrolling -->
    <div class="relative" style="width: 10000px; height: 5000px; min-width: 10000px; min-height: 5000px; background-image: radial-gradient(circle, #d1d5db 1px, transparent 1px); background-size: 20px 20px;">
        
        <!-- Zoom Layer -->
        <div class="absolute inset-0 origin-top-left" [style.transform]="'scale(' + scale + ')'">
            
            <!-- Connections Layer -->
            <svg class="absolute inset-0 w-full h-full pointer-events-none" style="overflow: visible; z-index: 0;">
                <path *ngFor="let conn of connections"
                      [attr.d]="getConnectionPath(conn)"
                      fill="none"
                      stroke="#a5b4fc"
                      stroke-width="3"
                      class="transition-all duration-75 ease-linear">
                </path>
            </svg>

            <!-- Nodes Layer -->
            <div *ngFor="let node of nodes"
                 [id]="node.id"
                 class="absolute rounded-2xl transition-shadow duration-200 cursor-move"
                 [style.left.px]="node.x"
                 [style.top.px]="node.y"
                 [style.width.px]="280"
                 [style.z-index]="draggedNode === node ? 100 : 10"
                 (mousedown)="onNodeMouseDown($event, node)"
                 [ngClass]="{'ring-1 ring-indigo-500': draggedNode === node}">
                
                <!-- Inner wrapper for clipping content but not ports -->
                <div class="rounded-2xl overflow-hidden bg-white border border-gray-200 flex flex-col w-full h-full pointer-events-auto hover:border-indigo-400 transition-colors">
                <!-- Node Header -->
                <div class="px-4 py-3 flex items-center justify-between border-b border-gray-100 bg-white">
                    <div class="flex items-center space-x-2 text-gray-500">
                        <mat-icon class="icon-size-4" *ngIf="node.type === 'image'">image</mat-icon>
                        <mat-icon class="icon-size-4" *ngIf="node.type === 'video'">movie</mat-icon>
                        <mat-icon class="icon-size-4" *ngIf="node.type === 'tts'">graphic_eq</mat-icon>
                        <mat-icon class="icon-size-4" *ngIf="node.type === 'composition'">layers</mat-icon>
                        <span class="text-sm font-medium">{{ node.title }}</span>
                    </div>
                    <span class="text-xs text-gray-400 font-medium">{{ node.subtitle }}</span>
                </div>

                <!-- Node Content -->
                <div class="p-4 flex flex-col space-y-3 bg-white">
                    <!-- Image / Video Preview -->
                    <div *ngIf="node.type === 'video' || node.type === 'composition'" class="relative w-full rounded-xl overflow-hidden bg-gray-100 border border-gray-200" [ngStyle]="{'aspect-ratio': node.data?.aspectRatio === '9:16' ? '9/16' : '16/9'}">
                        <img [src]="node.data.imageUrl" class="w-full h-full object-cover" *ngIf="node.data.imageUrl" />
                        <div *ngIf="!node.data.imageUrl" class="w-full h-full flex items-center justify-center text-gray-400 text-sm font-medium">Trống</div>
                        <!-- Video Icon Overlay -->
                        <div *ngIf="node.type === 'video' && node.data.isVideo" class="absolute inset-0 flex items-center justify-center">
                            <div class="w-10 h-10 bg-white/30 backdrop-blur-sm rounded-full flex items-center justify-center">
                                <mat-icon class="text-white">play_arrow</mat-icon>
                            </div>
                        </div>
                    </div>

                    <!-- TTS Audio Player Preview -->
                    <div *ngIf="node.type === 'tts'" class="w-full bg-gray-100 border border-gray-200 rounded-xl p-3 flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-full bg-white border border-gray-300 flex items-center justify-center cursor-pointer">
                            <mat-icon class="icon-size-5 text-gray-700">play_arrow</mat-icon>
                        </div>
                        <span class="text-sm font-medium text-gray-700">{{ node.data.duration }}</span>
                        <!-- Fake Waveform -->
                        <div class="flex-1 h-6 flex items-center space-x-1 overflow-hidden">
                            <div class="w-1 h-3 bg-gray-300 rounded-full"></div>
                            <div class="w-1 h-5 bg-gray-300 rounded-full"></div>
                            <div class="w-1 h-2 bg-gray-300 rounded-full"></div>
                            <div class="w-1 h-6 bg-gray-300 rounded-full"></div>
                            <div class="w-1 h-4 bg-gray-300 rounded-full"></div>
                            <div class="w-1 h-3 bg-gray-300 rounded-full"></div>
                            <div class="w-1 h-5 bg-gray-300 rounded-full"></div>
                            <div class="w-1 h-4 bg-gray-300 rounded-full"></div>
                        </div>
                    </div>

                    <!-- Text Content (Removed to save space) -->
                </div>
                </div>

                <!-- Input Ports (Left) -->
                <div class="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-1/2 flex flex-col space-y-8 pointer-events-auto" *ngIf="node.inputs.length > 0">
                    <div *ngFor="let port of node.inputs" class="w-6 h-6 bg-indigo-100 border border-indigo-200 rounded-full flex items-center justify-center text-indigo-500 cursor-crosshair hover:bg-indigo-200 transition-colors">
                        <div class="w-2 h-2 bg-indigo-500 rounded-full"></div>
                    </div>
                </div>

                <!-- Output Ports (Right) -->
                <div class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-1/2 flex flex-col space-y-8 pointer-events-auto" *ngIf="node.outputs.length > 0">
                    <div *ngFor="let port of node.outputs" class="w-6 h-6 bg-blue-100 border border-blue-200 rounded-full flex items-center justify-center text-blue-500 cursor-crosshair hover:bg-blue-200 transition-colors">
                        <mat-icon class="icon-size-3">chevron_right</mat-icon>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
</div>

<!-- Docked Global Prompt Editor (Fixed at bottom of viewport) -->
<div class="fixed bottom-12 left-0 right-0 flex justify-center z-[200] transition-all duration-300 pointer-events-none p-6">
    <div class="w-full max-w-4xl flex flex-col space-y-2 pointer-events-auto">
        <div class="flex items-center justify-between px-2">
            <span class="text-sm font-semibold text-gray-700 uppercase tracking-wider flex items-center space-x-2">
                <mat-icon class="icon-size-4 text-indigo-600">edit_note</mat-icon>
                <span *ngIf="selectedNode && selectedNode.type === 'video'">Chi tiết Prompt - {{ selectedNode.title }}</span>
                <span *ngIf="!selectedNode || selectedNode.type !== 'video'">Chi tiết Prompt</span>
            </span>
        </div>
        <textarea
            cdkTextareaAutosize
            cdkAutosizeMinRows="1"
            cdkAutosizeMaxRows="8"
            [ngModel]="selectedNode?.type === 'video' ? selectedNode?.data?.text : ''"
            (ngModelChange)="updatePrompt($event)"
            [disabled]="!selectedNode || selectedNode.type !== 'video'"
            [placeholder]="selectedNode && selectedNode.type === 'video' ? 'Nhập chi tiết prompt cho phân cảnh này...' : 'Chọn một phân cảnh (Scene) để bắt đầu nhập prompt...'"
            class="w-full bg-white border border-gray-300 rounded-2xl p-4 text-[15px] leading-relaxed text-gray-800 outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition-all resize-none hover:bg-gray-50/50 block disabled:opacity-80 disabled:bg-gray-50 disabled:cursor-not-allowed">
        </textarea>
    </div>
</div>
