<div class="flex items-center justify-between mb-4">
    <h2 class="text-lg font-semibold m-0">
        Cấu hình Khung xương & Bố cục (ControlNet)
    </h2>
    <div class="flex items-center gap-2">
        <button mat-icon-button mat-dialog-close>
            <mat-icon [svgIcon]="'heroicons_outline:x'"></mat-icon>
        </button>
    </div>
</div>

<mat-dialog-content class="flex flex-col gap-4 p-0 overflow-x-hidden scrollbar-hide !max-h-none">
    <div class="flex flex-col gap-3 w-full">
        <!-- Saved Templates Select -->
        <div *ngIf="savedControlTemplates.length > 0" class="flex flex-col gap-2 mb-2">
            <label class="font-medium text-slate-600 text-sm">Chọn từ bố cục đã lưu:</label>
            <div class="flex flex-wrap gap-2">
                <div *ngFor="let template of savedControlTemplates"
                    class="relative w-36 h-36 rounded-lg overflow-hidden border-2 cursor-pointer group hover:border-indigo-500 transition-colors"
                    [ngClass]="{'border-indigo-600': controlImageUrl === template.imageUrl, 'border-slate-200': controlImageUrl !== template.imageUrl}"
                    (click)="selectControlTemplate(template)" [title]="template.prompt">
                    <img [src]="getSafeUrl(template.imageUrl)" class="w-full h-full object-cover">
                    <div
                        class="absolute bottom-0 inset-x-0 bg-black/60 p-1 text-xs text-white truncate text-center">
                        {{ template.prompt }}
                    </div>
                    <button
                        class="absolute top-1 right-1 bg-red-500/80 hover:bg-red-600 text-white rounded-full w-6 h-6 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"
                        (click)="deleteControlTemplate(template.id, $event)" title="Xoá">
                        <mat-icon class="text-[14px] w-[14px] h-[14px] text-white">close</mat-icon>
                    </button>
                </div>
            </div>
        </div>

        <!-- Upload Area -->
        <div class="flex-1 w-full flex flex-col items-center justify-center transition-colors relative"
            [ngClass]="isPromptingForPose ? 'p-0 min-h-0' : 'p-6 border-2 border-dashed border-slate-300 rounded-xl bg-slate-50 hover:bg-slate-100 min-h-[200px]'">
            <input *ngIf="!isPromptingForPose" type="file" (change)="onControlImageSelected($event)" accept="image/*"
                class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">

            <div *ngIf="!isUploadingControlImage && !isPromptingForPose"
                class="flex flex-col items-center relative z-20 pointer-events-none">
                <mat-icon [svgIcon]="'heroicons_outline:cloud-upload'"
                    class="text-indigo-400 w-12 h-12 mb-3"></mat-icon>
                <p class="text-slate-600 font-medium mb-1">Kéo thả hoặc click để tải lên</p>
                <p class="text-slate-400 text-xs mb-4">Hỗ trợ JPG, PNG (Tối đa 5MB)</p>

                <div class="flex gap-2 mt-2 pointer-events-auto">
                    <button mat-flat-button class="bg-indigo-100 text-indigo-700 hover:bg-indigo-200 transition-colors"
                        (click)="openPosePrompt($event)">
                        <mat-icon>auto_awesome</mat-icon>
                        <mat-label class="ml-2">Tự tạo bằng AI</mat-label>
                    </button>
                    <button mat-flat-button class="bg-blue-100 text-blue-700 hover:bg-blue-200 transition-colors"
                        (click)="triggerVideoUpload($event)">
                        <mat-icon>movie</mat-icon>
                        <mat-label class="ml-2">Trích xuất từ Video</mat-label>
                    </button>
                    <input type="file" #videoUploadInput class="hidden" accept="video/*"
                        (change)="onVideoSelected($event)">
                </div>
            </div>

            <!-- Box tạo bằng AI -->
            <div *ngIf="!isUploadingControlImage && isPromptingForPose"
                class="flex flex-col items-center w-full z-20 bg-white p-5 rounded-xl border border-indigo-100 relative"
                (click)="$event.stopPropagation()">

                <div class="flex justify-between items-center w-full mb-3">
                    <h4 class="text-md font-semibold text-slate-800 flex items-center">
                        <mat-icon class="text-indigo-600 mr-2">auto_awesome</mat-icon> AI Vẽ Phác Thảo
                    </h4>
                </div>

                <p class="text-sm font-medium text-slate-600 mb-2 w-full">Mô tả tư thế / bố cục bạn muốn tạo:</p>
                <textarea [(ngModel)]="posePromptText"
                    class="w-full border border-slate-300 rounded-lg p-3 mb-3 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none resize-none"
                    rows="3"
                    placeholder="Ví dụ: Góc máy ngang tầm mắt, trung cảnh (Medium Shot). Một kiếm khách đang đứng thủ thế..."></textarea>

                <div class="flex items-center w-full justify-between">
                    <!-- Đính kèm ảnh mẫu -->
                    <div class="flex items-center">
                        <input type="file" #poseImageInput class="hidden" accept="image/*"
                            (change)="onPoseReferenceImageSelected($event)">
                        <div *ngIf="poseReferenceImageUrl" class="relative flex items-center h-full">
                            <img [src]="poseReferenceImageUrl"
                                class="h-10 w-10 object-cover rounded-lg shadow-sm border border-slate-200">
                            <button
                                class="absolute -top-2 -right-2 w-5 h-5 bg-red-500 text-white flex items-center justify-center rounded-full shadow hover:bg-red-600"
                                (click)="removePoseReferenceImage()">
                                <mat-icon style="font-size: 14px; width: 14px; height: 14px;">close</mat-icon>
                            </button>
                        </div>
                        <button *ngIf="!poseReferenceImageUrl" mat-flat-button class="text-white bg-green-300"
                            (click)="poseImageInput.click()">
                            <mat-icon>add_photo_alternate</mat-icon>
                            <mat-label class="ml-2">Đính kèm ảnh mẫu</mat-label>
                        </button>
                    </div>

                    <div class="flex gap-2">
                        <button mat-button (click)="isPromptingForPose = false">Hủy</button>
                        <button mat-flat-button class="bg-indigo-600 text-white hover:bg-indigo-700"
                            (click)="submitGeneratePose($event)">
                            <mat-icon>brush</mat-icon>
                            <mat-label class="ml-2">Tạo ảnh</mat-label>
                        </button>
                    </div>
                </div>
            </div>

            <div *ngIf="isUploadingControlImage" class="flex flex-col items-center z-20">
                <mat-spinner diameter="40"></mat-spinner>
                <p class="text-sm text-slate-500 mt-4 font-medium">{{ loadingMessage || 'Đang xử lý...' }}</p>
            </div>
        </div>

        <!-- Extracted Frames Gallery -->
        <div *ngIf="extractedFrames.length > 0"
            class="flex flex-col gap-2 bg-white p-4 rounded-xl border border-slate-200 shadow-sm w-full overflow-hidden">
            <div class="flex justify-between items-center mb-1">
                <label class="font-semibold text-slate-800 text-sm">Khung hình trích xuất từ Video (Chọn 1):</label>
                <button mat-icon-button color="warn" (click)="extractedFrames = []" matTooltip="Hủy bỏ">
                    <mat-icon>close</mat-icon>
                </button>
            </div>
            <div class="flex overflow-x-auto gap-3 pb-2 w-full custom-scrollbar" (wheel)="onFramesScroll($event)">
                <div *ngFor="let frame of extractedFrames"
                    class="flex-shrink-0 relative w-32 h-24 rounded-lg overflow-hidden border-2 cursor-pointer group hover:border-indigo-500 transition-colors border-slate-200"
                    (click)="selectExtractedFrame(frame)">
                    <img [src]="getSafeUrl(frame)" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-indigo-500/20 opacity-0 group-hover:opacity-100 transition-opacity">
                    </div>
                </div>
            </div>
        </div>
    </div>
</mat-dialog-content>
