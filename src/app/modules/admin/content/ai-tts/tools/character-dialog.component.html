<div class="bg-white rounded-lg flex flex-col">
    <h2 class="text-xl font-bold p-0 text-slate-800 m-0">
        {{ isEditMode ? 'Sửa' : 'Thêm' }} Nhân Vật
    </h2>

    <mat-dialog-content class="flex flex-col gap-2 p-0 py-4">
        <div class="flex flex-col gap-4 items-start mb-2">
            <!-- Avatar Section -->
            <div class="flex flex-wrap gap-3 w-full items-start mt-2 px-1">
                <div *ngFor="let url of editingChar.avatarUrls; let i = index"
                    class="relative w-20 h-20 shrink-0 rounded-md flex items-center justify-center bg-gray-50 overflow-visible group">
                    <img [src]="url" class="w-full h-full object-cover rounded-md">

                    <button mat-icon-button
                        class="absolute -top-2 -right-2 bg-red-500 text-white shadow-md rounded-full w-6 h-6 min-h-0 min-w-0 p-0 flex items-center justify-center hover:bg-red-600 transition-colors z-10"
                        (click)="removeAvatar(i)">
                        <mat-icon class="icon-size-4 text-white">close</mat-icon>
                    </button>
                </div>

                <div class="relative w-20 h-20 shrink-0 rounded-md border-2 border-dashed border-gray-300 flex items-center justify-center bg-gray-50 cursor-pointer hover:bg-gray-100 transition-colors"
                    (click)="avatarInput.click()">
                    <mat-icon class="text-gray-400 icon-size-8">add_photo_alternate</mat-icon>
                </div>

                <input #avatarInput type="file" multiple (change)="onAvatarSelected($event)" accept="image/*"
                    class="hidden">
            </div>

            <!-- Form Inputs -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-2 flex-grow w-full">
                <mat-form-field class="w-full fuse-mat-dense" [subscriptSizing]="'dynamic'">
                    <mat-label>Tên nhân vật</mat-label>
                    <input matInput [(ngModel)]="editingChar.name" placeholder="VD: Naruto" />
                </mat-form-field>

                <mat-form-field class="w-full fuse-mat-dense" [subscriptSizing]="'dynamic'">
                    <mat-label>Phiên bản (Tuỳ chọn)</mat-label>
                    <input matInput [(ngModel)]="editingChar.variant" placeholder="VD: Đồ công sở, Lúc tức giận..." />
                </mat-form-field>

                <mat-form-field class="w-full fuse-mat-dense" [subscriptSizing]="'dynamic'">
                    <mat-label>Vai trò</mat-label>
                    <input matInput [(ngModel)]="editingChar.role" placeholder="VD: Nhân vật chính" />
                </mat-form-field>
            </div>
        </div>

        <mat-form-field class="custom-textarea fuse-mat-dense fuse-mat-emphasized-affix" [subscriptSizing]="'dynamic'">
            <mat-label>Ngoại hình</mat-label>
            <textarea matInput class="px-2" [(ngModel)]="editingChar.appearance" placeholder="VD: Tóc vàng, áo cam..."
                cdkTextareaAutosize></textarea>
        </mat-form-field>

        <mat-form-field class="custom-textarea fuse-mat-dense fuse-mat-emphasized-affix" [subscriptSizing]="'dynamic'">
            <mat-label>Tính cách</mat-label>
            <textarea matInput class="px-2" [(ngModel)]="editingChar.personality"
                placeholder="VD: Năng động, ngốc nghếch..." cdkTextareaAutosize></textarea>
        </mat-form-field>

        <mat-form-field class="custom-textarea fuse-mat-dense fuse-mat-emphasized-affix" [subscriptSizing]="'dynamic'">
            <mat-label>Prompt Tạo hình (Tiếng Anh)</mat-label>
            <textarea matInput class="px-2" [(ngModel)]="editingChar.prompt" placeholder="A boy with blonde hair..."
                cdkTextareaAutosize></textarea>
            <mat-hint>Mô tả tiếng Anh chuẩn để dùng cho Midjourney/Stable Diffusion</mat-hint>
        </mat-form-field>
    </mat-dialog-content>

    <mat-dialog-actions align="end" class="pt-4 px-0 gap-1">
        <button mat-button mat-dialog-close>Hủy</button>
        <button mat-flat-button color="primary" [disabled]="!editingChar.name && !editingChar.role" (click)="save()">
            Lưu thông tin
        </button>
    </mat-dialog-actions>
</div>
