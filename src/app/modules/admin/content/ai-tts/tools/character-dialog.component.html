<div class="bg-white rounded-lg flex flex-col">
    <h2 class="text-xl font-bold p-0 text-slate-800 m-0 mb-4">
        {{ isEditMode ? 'Sửa' : 'Thêm' }} Nhân Vật
    </h2>

    <mat-dialog-content class="flex flex-col gap-2 p-0 !max-h-[85vh]">
        <div class="flex flex-col gap-4 items-start">
            <!-- Avatar Section -->
            <div class="flex flex-wrap gap-3 w-full items-start">
                <div *ngFor="let url of editingChar.avatarUrls; let i = index"
                    class="relative w-30 h-30 mt-3 shrink-0 rounded-md flex items-center justify-center bg-gray-50 overflow-visible group">
                    <img [src]="url" class="w-full h-full object-cover rounded-md">

                    <button mat-icon-button
                        class="absolute -top-2 -right-2 bg-red-500 text-white shadow-md rounded-full w-6 h-6 min-h-0 min-w-0 p-0 flex items-center justify-center hover:bg-red-600 transition-colors z-10"
                        (click)="removeAvatar(i)">
                        <mat-icon class="icon-size-4 text-white">close</mat-icon>
                    </button>
                </div>

                <div class="relative w-36 h-36 shrink-0 rounded-md border-2 border-dashed border-slate-300 flex flex-row items-center justify-center gap-2 bg-slate-50">
                    <button mat-icon-button class="bg-green-50 hover:bg-green-100 w-8 h-8 min-h-8 min-w-8 flex items-center justify-center rounded-full"
                        (click)="avatarInput.click()" matTooltip="Tải ảnh lên">
                        <mat-icon class="icon-size-4 text-green-600">upload_file</mat-icon>
                    </button>

                    <button mat-icon-button class="bg-blue-50 hover:bg-blue-100 w-8 h-8 min-h-8 min-w-8 flex items-center justify-center rounded-full" (click)="generateAvatar()"
                        [disabled]="isGeneratingAvatar" matTooltip="Tạo hình AI">
                        @if (isGeneratingAvatar) {
                        <mat-spinner diameter="16"></mat-spinner>
                        } @else {
                        <mat-icon class="icon-size-4 text-blue-500">auto_awesome</mat-icon>
                        }
                    </button>
                </div>

                <input #avatarInput type="file" multiple (change)="onAvatarSelected($event)" accept="image/*" class="hidden">
            </div>

            <!-- Form Inputs -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-2 flex-grow w-full">
                <mat-form-field class="w-full fuse-mat-dense" [subscriptSizing]="'dynamic'">
                    <mat-label>Tên nhân vật</mat-label>
                    <input matInput [(ngModel)]="editingChar.name" placeholder="VD: Naruto" />
                </mat-form-field>

                <mat-form-field class="w-full fuse-mat-dense" [subscriptSizing]="'dynamic'">
                    <mat-label>Phiên bản (Tuỳ chọn)</mat-label>
                    <input matInput [(ngModel)]="editingChar.variant" placeholder="VD: Đồ công sở, Lúc tức giận..." />
                </mat-form-field>

                <mat-form-field class="w-full fuse-mat-dense" [subscriptSizing]="'dynamic'">
                    <mat-label>Vai trò</mat-label>
                    <input matInput [(ngModel)]="editingChar.role" placeholder="VD: Nhân vật chính" />
                </mat-form-field>
            </div>
        </div>

        <mat-form-field class="custom-textarea fuse-mat-dense fuse-mat-emphasized-affix" [subscriptSizing]="'dynamic'">
            <mat-label>Ngoại hình</mat-label>
            <textarea matInput class="px-2" [(ngModel)]="editingChar.appearance" placeholder="VD: Tóc vàng, áo cam..." cdkTextareaAutosize cdkAutosizeMinRows="2"
                cdkAutosizeMaxRows="3"></textarea>
        </mat-form-field>


        <mat-form-field class="custom-textarea fuse-mat-dense fuse-mat-emphasized-affix" [subscriptSizing]="'dynamic'">
            <mat-label>Tính cách</mat-label>
            <textarea matInput class="px-2" [(ngModel)]="editingChar.personality" placeholder="VD: Năng động, ngốc nghếch..." cdkTextareaAutosize cdkAutosizeMinRows="2"
                cdkAutosizeMaxRows="2"></textarea>
        </mat-form-field>

        <mat-form-field class="custom-textarea fuse-mat-dense w-full" [subscriptSizing]="'dynamic'">
            <mat-label>Prompt Tạo hình</mat-label>
            <textarea matInput class="px-2 overflow-x-hidden" [(ngModel)]="editingChar.prompt" placeholder="VD: Một chàng trai tóc vàng, mặc áo thun..." cdkTextareaAutosize
                cdkAutosizeMinRows="3" cdkAutosizeMaxRows="5"></textarea>
            <button mat-icon-button matSuffix class="icon-size-8 absolute top-4 right-4" (click)="copyPrompt(editingChar.prompt); $event.preventDefault(); $event.stopPropagation()"
                matTooltip="Copy Prompt">
                <mat-icon class="icon-size-4 text-green-600 hover:text-green-800" [svgIcon]="'feather:copy'"></mat-icon>
            </button>
        </mat-form-field>
    </mat-dialog-content>

    <mat-dialog-actions align="end" class="flex pt-4 mt-0 px-0 gap-1">
        <button mat-button mat-dialog-close>Hủy</button>
        <button mat-flat-button color="primary" [disabled]="!editingChar.name && !editingChar.role" (click)="save()">
            Lưu thông tin
        </button>
    </mat-dialog-actions>
</div>
