<div class="flex flex-row justify-between items-center pb-4 border-b border-gray-200 mb-4">
    <div class="flex items-center text-xl font-normal text-gray-800 tracking-tight">
        <mat-icon class="mr-2 icon-size-5 text-blue-600" [svgIcon]="'feather:alert-circle'"></mat-icon>
        <span>Dựng kịch bản Video</span>
    </div>

    <button mat-raised-button class="bg-green-500 text-white" (click)="addNewScene()">
        <mat-icon class="icon-size-4 mr-1">add</mat-icon>
        <mat-label class="ml-2">Thêm Scene mới</mat-label>
    </button>
</div>

<div mat-dialog-content class="p-0 overflow-hidden">
    <div class="flex overflow-x-hidden scrollbar-hide rounded-xl space-x-4 pb-6 timeline-container cursor-grab active:cursor-grabbing"
        #scrollContainer (mousedown)="startDragging($event)" (mouseleave)="stopDragging()" (mouseup)="stopDragging()"
        (mousemove)="moveEvent($event)" cdkDropList cdkDropListOrientation="horizontal"
        (cdkDropListDropped)="onSceneDropped($event)">

        @for (scene of projectData?.scenes; track scene.id || $index) {
        <div class="flex-none w-80 bg-gray-50 rounded-lg overflow-hidden select-none example-box relative" cdkDrag>
            <div class="cdk-drag-handle absolute top-2 left-2 z-10 w-8 h-8 flex items-center justify-center bg-white/80 rounded-full cursor-move shadow-sm hover:bg-white"
                cdkDragHandle>
                <mat-icon class="text-gray-500 icon-size-5">drag_indicator</mat-icon>
            </div>

            <button mat-icon-button color="warn"
                class="absolute top-2 right-2 z-10 bg-white/80 hover:bg-red-50 icon-size-8 shadow-sm flex items-center justify-center rounded-full"
                (click)="$event.stopPropagation(); removeScene($index)" size="small">
                <mat-icon class="icon-size-4">delete</mat-icon>
            </button>

            <div class="h-44 bg-gray-100 relative flex items-center justify-center group">
                @if (scene.imageUrl) {
                <ng-container *ngIf="isImageType(scene.imageUrl); else videoPlayer">
                    <img [src]="scene.imageUrl" class="w-full h-full object-cover pointer-events-none">
                </ng-container>
                <ng-template #videoPlayer>
                    <video [src]="scene.imageUrl" class="w-full h-full object-cover" controls muted
                        [id]="'video_' + $index"></video>
                </ng-template>
                } @else {
                <div class="text-center p-4">
                    <mat-icon class="text-gray-400 text-5xl">image</mat-icon>
                    <p class="text-xs text-gray-500 mt-2">No image selected</p>
                </div>
                }

                <div
                    class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity gap-2 z-0">
                    <button mat-raised-button color="primary" size="small"
                        (click)="$event.stopPropagation(); generateImage(scene, $index)">
                        Regenerate
                    </button>
                    <button mat-raised-button color="accent" size="small"
                        (click)="$event.stopPropagation(); fileInput.click()">
                        Select File
                    </button>
                    <input #fileInput type="file" (change)="onFileSelected($event, scene)" accept="image/*,video/*"
                        class="hidden">
                </div>
            </div>

            <div class="p-4 flex flex-col h-64">
                <div class="flex justify-between items-start mb-3">
                    <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-1 rounded-full">
                        Scene #{{ $index + 1 }}
                    </span>
                </div>

                <div class="flex-grow overflow-y-auto mb-3 text-sm rounded-md bg-gray-50 p-2 border border-gray-100 scrollbar-hide"
                    cdkScrollable>
                    @for (sub of scene.subtitles; track sub.id) {
                    <p class="mb-1.5 last:mb-0 text-gray-700 leading-relaxed">
                        <span class="font-mono text-[10px] text-gray-400 bg-gray-100 px-1 rounded">[{{sub.id}}]</span>
                        {{ sub.text }}
                    </p>
                    }
                </div>

                <div class="mt-auto pt-3 border-t border-gray-100">
                    <p class="text-[11px] text-gray-500 italic line-clamp-2 prompt-text" [title]="scene.prompt">
                        <strong class="text-gray-600 not-italic">Prompt:</strong> {{ scene.prompt }}
                    </p>
                </div>
            </div>
        </div>
        }
    </div>
</div>

<div mat-dialog-actions class="flex flex-row gap-3 p-0 mt-6 pt-4 border-t border-gray-200">
    <button mat-flat-button color="accent" (click)="close()">Đóng</button>
    <div class="flex-grow"></div>
    <button mat-flat-button color="primary" (click)="generateAllImages()">
        <mat-icon class="mr-1 icon-size-4">auto_awesome</mat-icon>
        <mat-label class="ml-2">Bắt đầu phát sóng</mat-label>
    </button>
</div>
