        <!-- Tab ControlNet -->
        <div *ngIf="activeTab === 'controlnet'" class="flex flex-col gap-4 py-4 min-h-[300px]">


            <!-- Saved Templates Select -->
            <div *ngIf="savedControlTemplates.length > 0" class="flex flex-col gap-2">
                <label class="font-semibold text-gray-800 text-sm">Chọn từ bố cục đã lưu:</label>
                <div class="flex flex-wrap gap-2">
                    <div *ngFor="let template of savedControlTemplates"
                        class="relative w-24 h-24 rounded-lg overflow-hidden border-2 cursor-pointer group hover:border-indigo-500 transition-colors"
                        [ngClass]="{'border-indigo-600': controlImageUrl === template.imageUrl, 'border-gray-200': controlImageUrl !== template.imageUrl}"
                        (click)="selectControlTemplate(template)" [title]="template.prompt">
                        <img [src]="getSafeUrl(template.imageUrl)" class="w-full h-full object-cover">
                        <div
                            class="absolute bottom-0 inset-x-0 bg-black/60 p-1 text-[10px] text-white truncate text-center">
                            {{ template.prompt }}
                        </div>
                        <button
                            class="absolute top-1 right-1 bg-red-500/80 hover:bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"
                            (click)="deleteControlTemplate(template.id, $event)" title="Xoá">
                            <mat-icon class="text-[14px] w-[14px] h-[14px] text-white">close</mat-icon>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Upload Area -->
            <div class="flex-1 w-full flex flex-col items-center justify-center p-8 border-2 border-dashed border-gray-300 rounded-2xl bg-gray-50 hover:bg-gray-100 transition-colors relative"
                *ngIf="!controlImageUrl">
                <input type="file" (change)="onControlImageSelected($event)" accept="image/*"
                    class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                <div *ngIf="!isUploadingControlImage && !isPromptingForPose" class="flex flex-col items-center">
                    <mat-icon [svgIcon]="'heroicons_outline:cloud-upload'"
                        class="text-gray-400 w-16 h-16 mb-4"></mat-icon>
                    <p class="text-gray-600 font-medium mb-1">Kéo thả hoặc click để tải lên</p>
                    <p class="text-gray-400 text-xs mb-4">Hỗ trợ JPG, PNG (Tối đa 5MB)</p>

                    <div class="flex gap-2 mt-2 z-20 relative">
                        <button mat-flat-button color="accent" class="bg-indigo-100 text-indigo-700 hover:bg-indigo-200 transition-colors" (click)="openPosePrompt($event)">
                            <mat-icon [svgIcon]="'heroicons_outline:sparkles'"></mat-icon>
                            <mat-label class="ml-2">Tự tạo bằng AI</mat-label>
                        </button>
                        <button mat-flat-button color="primary" class="bg-indigo-600 text-white hover:bg-indigo-700" (click)="triggerVideoUpload($event)">
                            <mat-icon [svgIcon]="'heroicons_outline:film'"></mat-icon>
                            <mat-label class="ml-2">Trích xuất từ Video</mat-label>
                        </button>
                        <input type="file" #videoUploadInput class="hidden" accept="video/*" (change)="onVideoSelected($event)">
                    </div>
                </div>

                <div *ngIf="!isUploadingControlImage && isPromptingForPose"
                    class="flex flex-col items-center w-full max-w-sm z-20 bg-white p-4 rounded-xl shadow border border-gray-200"
                    (click)="$event.stopPropagation()">
                    <p class="text-sm font-semibold text-gray-700 mb-2 w-full">Mô tả tư thế / bố cục bạn muốn tạo:</p>
                    <textarea [(ngModel)]="posePromptText"
                        class="w-full border border-gray-300 rounded-lg p-3 mb-3 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none resize-none"
                        rows="3"
                        placeholder="Ví dụ: Góc máy ngang tầm mắt, trung cảnh (Medium Shot). Một kiếm khách đang đứng thủ thế, tay phải cầm kiếm hướng về phía trước, tay trái đưa lên cao..."></textarea>
                    <div class="flex gap-2 w-full justify-end">
                        <button mat-button (click)="isPromptingForPose = false">Hủy</button>
                        <button mat-flat-button color="primary" (click)="submitGeneratePose($event)">
                            <mat-icon [svgIcon]="'heroicons_outline:sparkles'"></mat-icon>
                            <mat-label class="ml-2">Tạo ảnh</mat-label>
                        </button>
                    </div>
                </div>
                <div *ngIf="isUploadingControlImage" class="flex flex-col items-center">
                    <mat-spinner diameter="40"></mat-spinner>
                    <p class="text-sm text-gray-500 mt-4">{{ loadingMessage || 'Đang xử lý...' }}</p>
                </div>
            </div>

            <!-- Extracted Frames Gallery -->
            <div *ngIf="extractedFrames.length > 0" class="flex flex-col gap-2 mt-4 bg-white p-4 rounded-xl border border-gray-200 w-full overflow-hidden">
                <div class="flex justify-between items-center mb-2">
                    <label class="font-semibold text-gray-800 text-sm">Khung hình trích xuất từ Video (Chọn 1):</label>
                    <button mat-button color="warn" (click)="extractedFrames = []">Hủy bỏ</button>
                </div>
                <div class="flex overflow-x-auto gap-2 pb-2 w-full custom-scrollbar" (wheel)="onFramesScroll($event)">
                    <div *ngFor="let frame of extractedFrames"
                        class="flex-shrink-0 relative w-32 h-24 rounded-lg overflow-hidden border-2 cursor-pointer group hover:border-indigo-500 transition-colors border-gray-200"
                        (click)="selectExtractedFrame(frame)">
                        <img [src]="getSafeUrl(frame)" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-indigo-500/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    </div>
                </div>
            </div>

            <!-- Preview Area -->
            <div *ngIf="controlImageUrl" class="flex flex-col gap-2">
                <div
                    class="w-full relative rounded-2xl overflow-hidden border border-gray-200 shadow-sm bg-gray-50 flex items-center justify-center h-[350px]">
                    <img [src]="getSafeUrl(controlImageUrl)" class="max-w-full max-h-full object-contain">
                    <div class="absolute top-4 right-4 z-10 flex gap-2">
                        <button mat-mini-fab color="primary" class="shadow-md" (click)="saveCurrentControlAsTemplate()"
                            matTooltip="Lưu làm bố cục mẫu">
                            <mat-icon [svgIcon]="'heroicons_outline:bookmark'"></mat-icon>
                        </button>
                        <button mat-mini-fab color="warn" class="shadow-md" (click)="removeControlImage()"
                            matTooltip="Xóa ảnh">
                            <mat-icon [svgIcon]="'heroicons_outline:trash'"></mat-icon>
                        </button>
                    </div>
                </div>
            </div>
        </div>
