<div class="w-full max-w-4xl">
    <!-- Section -->
    <div class="w-full">
        <div class="text-xl text-secondary leading-8 mt-2">
            {{ "app.create_your_own_writing" | transloco }}
        </div>
    </div>

    <div class="grid sm:grid-cols-3 grid-cols-1 gap-6 w-full mt-10">
        @if (styles && styles.length > 0) {
            @for (style of styles; track style; let i = $index) {
                <fuse-card class="flex flex-col" [flippable]="true" #fuseCard>
                    <!-- Front -->
                    <ng-container fuseCardFront>
                        <div class="flex flex-col px-8 py-6 pb-3">
                            <div class="text-lg font-semibold">
                                {{ style.name }}
                            </div>
                            <div
                                class="mt-2 min-h-50 max-h-50 overflow-auto hover-scroll text-base"
                            >
                                {{ style.desc }}
                            </div>
                            <div class="mt-3 -mx-3 self-end">
                                <button mat-icon-button (click)="delete(i)">
                                    <mat-icon
                                        class="icon-size-4 text-red-500"
                                        [svgIcon]="'feather:trash'"
                                    ></mat-icon>
                                </button>
                                <button
                                    mat-icon-button
                                    class="ml-0"
                                    [color]="'primary'"
                                    (click)="edit(i)"
                                >
                                    <mat-icon
                                        class="icon-size-4"
                                        [svgIcon]="'feather:edit-2'"
                                    ></mat-icon>
                                </button>
                                <button
                                    mat-icon-button
                                    class="ml-0"
                                    [color]="'primary'"
                                    (click)="fuseCard.face = 'back'"
                                >
                                    <mat-icon
                                        class="icon-size-4"
                                        [svgIcon]="'heroicons_outline:arrow-right'"
                                    ></mat-icon>
                                </button>
                            </div>
                        </div>
                    </ng-container>
                    <!-- Back -->
                    <ng-container fuseCardBack>
                        <div
                            class="flex flex-col flex-auto px-8 py-6 pt-3 overflow-hidden"
                        >
                            <div class="mb-2 -mx-3">
                                <button
                                    mat-icon-button
                                    [color]="'primary'"
                                    (click)="fuseCard.face = 'front'"
                                >
                                    <mat-icon
                                        class="icon-size-5"
                                        [svgIcon]="'heroicons_outline:arrow-left'"
                                    ></mat-icon>
                                </button>
                            </div>
                            <div class="overflow-auto hover-scroll h-full">
                                <img
                                    src="{{ style.avatar }}"
                                    class="h-20 w-auto rounded-md"
                                />
                                <div class="mt-2">
                                    <button mat-icon-button [color]="'primary'">
                                        <mat-icon
                                            class="icon-size-5"
                                            [svgIcon]="'feather:volume-2'"
                                        ></mat-icon>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </ng-container>
                </fuse-card>
            }
        }

        <fuse-card class="flex flex-col">
            <div
                class="flex flex-row flex-auto p-8 justify-center items-center overflow-hidden"
            >
                <button mat-icon-button [color]="'primary'" (click)="add()">
                    <mat-icon
                        class="icon-size-5"
                        [svgIcon]="'feather:plus'"
                    ></mat-icon>
                </button>

                <button
                    mat-icon-button
                    class="ml-1"
                    [color]="'primary'"
                    (click)="update()"
                >
                    <mat-icon
                        class="icon-size-5"
                        [svgIcon]="'feather:upload-cloud'"
                    ></mat-icon>
                </button>
            </div>
        </fuse-card>
    </div>
</div>
