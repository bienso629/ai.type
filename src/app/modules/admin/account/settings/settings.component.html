<div class="flex flex-col w-full min-w-0 sm:absolute sm:inset-0 sm:overflow-hidden">
    <mat-drawer-container class="flex-auto sm:h-full">
        <!-- Drawer -->
        <mat-drawer class="dark:bg-gray-900 transition-all duration-300 ease-in-out !overflow-x-hidden border-r"
            [style.width]="isCompact ? '80px' : '320px'"
            [autoFocus]="false" mode="side" [opened]="true"
            #drawer>
            <!-- Header -->
            <div class="flex items-center w-full"
                [ngClass]="isCompact ? 'justify-center py-6' : 'justify-between px-8 my-6 sm:my-10'">
                <!-- Title -->
                <div class="text-4xl font-extrabold tracking-tight leading-none" *ngIf="!isCompact">{{ 'app.settings' | transloco }}</div>

                <div class="flex items-center justify-center">
                    <button mat-icon-button (click)="toggleCompact()" [matTooltip]="isCompact ? 'Mở rộng cột Cài đặt' : 'Thu nhỏ (chỉ hiện Icon)'" class="text-gray-600 dark:text-gray-400">
                        <mat-icon [svgIcon]="isCompact ? 'heroicons_outline:chevron-right' : 'heroicons_outline:chevron-left'"></mat-icon>
                    </button>
                </div>
            </div>
            <!-- Panel links -->
            <div class="flex flex-col divide-y border-t border-b">
                <ng-container *ngFor="let panel of panels; trackBy: trackByFn">
                    <div class="flex py-5 cursor-pointer transition-colors"
                        [ngClass]="{
                            'px-8': !isCompact,
                            'px-4 justify-center': isCompact,
                            'hover:bg-gray-100 dark:hover:bg-hover': !selectedPanel || selectedPanel !== panel.id,
                            'bg-primary-50 dark:bg-hover': selectedPanel && selectedPanel === panel.id
                        }"
                        (click)="goToPanel(panel.id)"
                        [matTooltip]="isCompact ? (panel.title | transloco) : ''"
                        matTooltipPosition="right">
                        <mat-icon [ngClass]="{
                                'mt-1': !isCompact,
                                'text-hint': !selectedPanel || selectedPanel !== panel.id,
                                'text-primary dark:text-primary-500': selectedPanel && selectedPanel === panel.id
                            }"
                            [svgIcon]="panel.icon"></mat-icon>
                        <div class="ml-3" *ngIf="!isCompact">
                            <div class="font-medium leading-6"
                                [ngClass]="{'text-primary dark:text-primary-500': selectedPanel && selectedPanel === panel.id}">
                                {{panel.title | transloco}}
                            </div>
                            <div class="mt-0.5 text-secondary">
                                {{panel.description | transloco}}
                            </div>
                        </div>
                    </div>
                </ng-container>
            </div>
        </mat-drawer>

        <!-- Drawer content -->
        <mat-drawer-content class="flex flex-col bg-white transition-all duration-300 ease-in-out !overflow-x-hidden"
            [style.margin-left]="isCompact ? '80px' : '320px'">
            <!-- Main -->
            <div class="flex-auto px-6 pt-9 pb-12 md:p-8 md:pb-12 lg:p-12">
                <!-- Panel header -->
                <div class="flex items-center">
                    <!-- Panel title -->
                    <div class="text-3xl font-semibold tracking-tight leading-none">
                        {{getPanelInfo(selectedPanel)?.title | transloco}}
                    </div>
                </div>

                <!-- Load settings panel -->
                <div class="mt-8">
                    <ng-container [ngSwitch]="selectedPanel">
                        <!-- Account -->
                        <ng-container *ngSwitchCase="'account'">
                            <settings-account></settings-account>
                        </ng-container>
                        <!-- ChatGPT -->
                        <ng-container *ngSwitchCase="'admin'">
                            <settings-admin></settings-admin>
                        </ng-container>
                        <!-- Notifications -->
                        <ng-container *ngSwitchCase="'domain'">
                            <settings-domain></settings-domain>
                        </ng-container>
                        <!-- Phong cách viết -->
                        <ng-container *ngSwitchCase="'style'">
                            <settings-style></settings-style>
                        </ng-container>
                        <!-- Plugins -->
                        <ng-container *ngSwitchCase="'plugins'">
                            <settings-plugins></settings-plugins>
                        </ng-container>
                        <!-- Font chữ -->
                        <ng-container *ngSwitchCase="'font'">
                            <settings-font></settings-font>
                        </ng-container>
                        <!-- Gia hạn -->
                        <ng-container *ngSwitchCase="'active'">
                            <settings-active></settings-active>
                        </ng-container>
                        <!-- Nạp tiền vào tài khoản -->
                        <ng-container *ngSwitchCase="'money'">
                            <settings-money></settings-money>
                        </ng-container>
                        <!-- Team -->
                        <!-- <ng-container *ngSwitchCase="'team'">
                            <settings-team></settings-team>
                        </ng-container> -->
                    </ng-container>
                </div>
            </div>
        </mat-drawer-content>
    </mat-drawer-container>
</div>
