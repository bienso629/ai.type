<div class="absolute inset-0 flex flex-col min-w-0 overflow-hidden bg-white">
    <!-- Main -->
    <div class="flex-auto overflow-y-auto" cdkScrollable>


        <!-- CONTENT GOES HERE -->
        <div class="p-6 md:p-8">
            <div class="text-2xl font-bold tracking-tight leading-8 mb-6">100 tập của bạn</div>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <div *ngFor="let item of collections" [routerLink]="['/collection']"
                    [queryParams]="{ collectionId: item._id }"
                    class="flex flex-col bg-card shadow-none border border-gray-200 hover:border-green-600 rounded-lg overflow-hidden cursor-pointer">
                    <div class="p-6 flex flex-col flex-auto">
                        <div class="flex items-center justify-between mb-4">
                            <div class="text-lg font-medium tracking-tight truncate" [title]="item.title">{{item.title}}
                            </div>
                            <div
                                class="flex items-center justify-center min-w-8 h-8 px-2 rounded-full bg-primary-50 text-primary-600 font-semibold text-sm">
                                {{item.count || 0}}
                            </div>
                        </div>
                        <div class="mt-4 flex items-center justify-between text-xs text-secondary">
                            <span class="flex items-center">
                                <mat-icon class="icon-size-4 mr-1.5" [svgIcon]="'feather:clock'"></mat-icon>
                                {{item.updatedAt | date:'dd/MM/yyyy'}}
                            </span>
                            <span
                                class="bg-gray-100 text-gray-500 px-2 py-0.5 rounded text-[11px] uppercase tracking-wider font-medium">{{item.type}}</span>
                        </div>
                    </div>
                </div>
            </div>

            <div *ngIf="!collections || collections.length === 0"
                class="flex flex-col items-center justify-center p-8 sm:p-12">
                <div class="text-2xl font-normal tracking-tight text-secondary">Chưa có tập nào</div>
            </div>
        </div>
    </div>
