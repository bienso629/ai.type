<div class="flex flex-col w-full min-w-0 sm:absolute sm:inset-0 sm:overflow-hidden figma-projects">
    <mat-drawer-container class="flex-auto sm:h-full">
        <!-- Drawer / Left Sidebar -->
        <mat-drawer class="sm:w-80 dark:bg-gray-900" [autoFocus]="false" [mode]="drawerMode" [opened]="drawerOpened" #drawer>
            <!-- Header -->
            <div class="flex items-center justify-between m-8 mr-6 sm:my-10">
                <!-- Title -->
                <div class="text-4xl font-extrabold tracking-tight leading-none">Figma</div>
                <!-- Close button -->
                <div class="lg:hidden">
                    <button mat-icon-button (click)="drawer.close()">
                        <mat-icon [svgIcon]="'heroicons_outline:x'"></mat-icon>
                    </button>
                </div>
            </div>

            <!-- Panel links / Project files list with background thumbnail, name & date -->
            <div class="flex flex-col overflow-y-auto flex-1">
                <ng-container *ngFor="let project of filteredProjects">
                    <div class="relative flex items-center px-6 py-5 cursor-pointer transition-all duration-200 overflow-hidden group min-h-[72px]"
                         [ngClass]="{'border-l-4 border-l-primary': selectedProject && selectedProject.id === project.id}"
                         (click)="selectProject(project)">
                        
                        <!-- Background Thumbnail Image -->
                        <div class="absolute inset-0 bg-cover bg-center transition-transform duration-500 scale-[1.2] group-hover:scale-[1.5]"
                             [style.background-image]="'url(' + project.thumbnail + ')'">
                        </div>

                        <!-- Gradient Overlay for readability -->
                        <div class="absolute inset-0 transition-colors duration-200"
                             [ngClass]="selectedProject?.id === project.id 
                                        ? 'bg-gradient-to-r from-black/85 via-black/70 to-black/50' 
                                        : 'bg-gradient-to-r from-black/80 via-black/65 to-black/45 group-hover:from-black/70 group-hover:to-black/35'">
                        </div>

                        <!-- Content (Name, Type & Date/Time) -->
                        <div class="relative z-10 min-w-0 flex-1">
                            <div class="flex items-center space-x-2">
                                <span *ngIf="project.type"
                                      class="px-1.5 py-0.5 rounded text-[10px] font-extrabold uppercase tracking-wider backdrop-blur-md"
                                      [ngClass]="project.type === 'make' 
                                                 ? 'bg-purple-500/30 text-purple-200 border border-purple-400/40' 
                                                 : 'bg-blue-500/30 text-blue-200 border border-blue-400/40'">
                                    {{ project.type }}
                                </span>
                            </div>
                            <div class="font-bold leading-tight text-base truncate text-white mt-1"
                                 [ngClass]="{'!text-primary-300 font-extrabold': selectedProject && selectedProject.id === project.id}">
                                {{ project.name }}
                            </div>
                            <div class="mt-1 text-xs text-gray-300 truncate font-medium flex items-center">
                                <mat-icon [svgIcon]="'feather:clock'" class="icon-size-3 mr-1 text-gray-400"></mat-icon>
                                {{ project.lastModified }}
                            </div>
                        </div>

                        <!-- Active Indicator Badge -->
                        <div *ngIf="selectedProject?.id === project.id" class="relative z-10 ml-2">
                            <span class="w-2 h-2 rounded-full bg-primary inline-block animate-pulse"></span>
                        </div>
                    </div>
                </ng-container>

                <div *ngIf="filteredProjects.length === 0" class="p-6 text-center text-xs text-gray-400">
                    Không thấy file nào
                </div>
            </div>
        </mat-drawer>

        <!-- Main Content Area (Empty for now as requested) -->
        <mat-drawer-content class="flex flex-col bg-white dark:bg-gray-900">
            <div class="flex-auto p-6 md:p-8 lg:p-10">
                <!-- Empty content body -->
            </div>
        </mat-drawer-content>
    </mat-drawer-container>
</div>
