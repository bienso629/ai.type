<div class="flex flex-col w-full min-w-0 sm:absolute sm:inset-0 sm:overflow-hidden">
    <mat-drawer-container class="flex-auto sm:h-full">
        <!-- Drawer -->
        <mat-drawer class="dark:bg-gray-900 transition-all duration-300 ease-in-out !overflow-x-hidden"
            [style.width]="isCompact ? '80px' : '320px'"
            [autoFocus]="false" mode="side" [opened]="true"
            #drawer>
            <!-- Header -->
            <div class="flex items-center w-full"
                [ngClass]="isCompact ? 'justify-center py-6' : 'justify-between px-8 my-6 sm:my-10'">
                <!-- Title -->
                <div class="text-4xl font-extrabold tracking-tight leading-none" *ngIf="!isCompact">{{ 'app.auto_script' | transloco }}</div>

                <div class="flex items-center justify-center">
                    <button mat-icon-button (click)="toggleCompact()" [matTooltip]="isCompact ? 'Mở rộng cột Kịch bản' : 'Thu nhỏ (chỉ hiện Icon)'" class="text-gray-600 dark:text-gray-400">
                        <mat-icon [svgIcon]="isCompact ? 'heroicons_outline:chevron-right' : 'heroicons_outline:chevron-left'"></mat-icon>
                    </button>
                </div>
            </div>
            <!-- Panel links -->
            <div class="flex flex-col divide-y border-t border-b">
                <ng-container *ngFor="let panel of panels; trackBy: trackByFn">
                    <div class="flex py-5 cursor-pointer transition-colors"
                        [ngClass]="{
                            'px-8': !isCompact,
                            'px-4 justify-center': isCompact,
                            'hover:bg-gray-100 dark:hover:bg-hover': !selectedPanel || selectedPanel !== panel.id,
                            'bg-primary-50 dark:bg-hover': selectedPanel && selectedPanel === panel.id
                        }"
                        (click)="goToPanel(panel.id)"
                        [matTooltip]="isCompact ? panel.title : ''"
                        matTooltipPosition="right">
                        <mat-icon [ngClass]="{
                                'mt-1': !isCompact,
                                'text-hint': !selectedPanel || selectedPanel !== panel.id,
                                'text-primary dark:text-primary-500': selectedPanel && selectedPanel === panel.id
                            }"
                            [svgIcon]="panel.icon"></mat-icon>
                        <div class="ml-3" *ngIf="!isCompact">
                            <div class="font-medium leading-6"
                                [ngClass]="{'text-primary dark:text-primary-500': selectedPanel && selectedPanel === panel.id}">
                                {{panel.title}}
                            </div>
                            <div class="mt-0.5 text-secondary">
                                {{panel.description}}
                            </div>
                        </div>
                    </div>
                </ng-container>
            </div>
        </mat-drawer>

        <!-- Drawer content -->
        <mat-drawer-content class="flex flex-col bg-white transition-all duration-300 ease-in-out !overflow-x-hidden"
            [style.margin-left]="isCompact ? '80px' : '320px'">
            <!-- Main -->
            <ng-container [ngSwitch]="selectedPanel">
                <!-- Hello App -->
                <ng-container *ngSwitchCase="'profiles'">
                    <amxh-profile class="h-full"></amxh-profile>
                </ng-container>
                
                <!-- Slide -->
                <ng-container *ngSwitchCase="'script'">
                    <amxh-script class="h-full" [data]="captions"></amxh-script>
                </ng-container>

                <!-- Shopee -->
                <ng-container *ngSwitchCase="'shopee'">
                    <amxh-shopee class="h-full" [data]="captions"></amxh-shopee>
                </ng-container>

                <!-- Type -->
                <ng-container *ngSwitchCase="'type'">
                    <amxh-type class="h-full" [data]="captions"></amxh-type>
                </ng-container>

                <!-- Schedule -->
                <ng-container *ngSwitchCase="'schedule'">
                    <amxh-schedule class="h-full"></amxh-schedule>
                </ng-container>

                <!-- Share -->
                <ng-container *ngSwitchCase="'share'">
                    <amxh-share class="h-full" [data]="articleData"></amxh-share>
                </ng-container>
            </ng-container>
        </mat-drawer-content>
    </mat-drawer-container>
</div>
