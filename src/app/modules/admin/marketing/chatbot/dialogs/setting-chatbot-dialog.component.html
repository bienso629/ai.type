<h2 class="text-xl font-normal text-gray-500 flex items-center justify-self-stretch mb-4">
    <mat-icon class="icon-size-4" svgIcon="feather:settings"></mat-icon>
    <mat-label class="ml-2">Cài đặt Chatbot</mat-label>
</h2>

<div class="mb-4">
    <label class="block text-sm font-semibold mb-2">Nguồn dữ liệu trả lời</label>
    <div class="grid grid-cols-3 gap-2">
        <label class="flex items-center gap-2 p-2 border rounded cursor-pointer hover:bg-gray-100">
            <input type="radio" name="dataSource" value="documents" [(ngModel)]="selectedDataSource" />
            <span class="text-base">Documents</span>
        </label>
        <label class="flex items-center gap-2 p-2 border rounded cursor-pointer hover:bg-gray-100">
            <input type="radio" name="dataSource" value="website" [(ngModel)]="selectedDataSource" />
            <span class="text-base">Website</span>
        </label>
        <label class="flex items-center gap-2 p-2 border rounded cursor-pointer hover:bg-gray-100">
            <input type="radio" name="dataSource" value="all" [(ngModel)]="selectedDataSource" />
            <span class="text-base">All</span>
        </label>
    </div>
</div>

<div class="mb-4" *ngIf="selectedDataSource === 'documents' || selectedDataSource === 'all'">
    <label class="block text-sm font-semibold mb-2">Chọn loại tài liệu (có thể chọn nhiều)</label>
    <div class="grid grid-cols-2 gap-2 max-h-[400px] overflow-y-auto">
        <label *ngFor="let type of docTypes"
            class="flex items-center gap-2 p-2 border rounded cursor-pointer hover:bg-gray-100">
            <input type="checkbox" [checked]="selectedDocTypes.includes(type.value)"
                (change)="toggleDocType(type.value)" />
            <span class="text-base">{{ type.label }}</span>
        </label>
    </div>
</div>

<div class="mb-4" *ngIf="selectedDataSource === 'website' || selectedDataSource === 'all'">
    <label class="block text-sm font-semibold mb-2">Chọn Website (có thể chọn nhiều)</label>

    <div *ngIf="!domainOptions || domainOptions.length === 0" class="text-sm text-red-500 italic">
        Bạn chưa có domain nào. Hãy dùng chức năng "Học nội dung Website" trước.
    </div>

    <div class="grid grid-cols-2 gap-2 max-h-[400px] overflow-y-auto" *ngIf="domainOptions && domainOptions.length > 0">
        <label *ngFor="let d of domainOptions"
            class="flex items-center gap-2 p-2 border rounded cursor-pointer hover:bg-gray-100">
            <input type="checkbox" [checked]="selectedSettingsDomains.includes(d.domain)"
                (change)="toggleSettingsDomain(d.domain)" />
            <span class="text-base truncate" [title]="d.domain">{{ d.domain }}</span>
        </label>
    </div>
</div>

<div class="mb-4">
    <label class="block text-sm font-semibold mb-2">Yêu cầu bổ sung cho AI (Prompt)</label>
    <p class="text-xs text-gray-400 mb-2">Ví dụ: "Hãy trả lời ngắn gọn", "Luôn trích dẫn tên sách", "Dùng giọng
        văn hài hước"...</p>
    <textarea
        class="w-full border rounded px-3 py-2 h-[80px] text-md focus:outline-none focus:ring-2 focus:ring-primary-500"
        [(ngModel)]="customPrompt" placeholder="Nhập yêu cầu bổ sung của bạn vào đây...">
        </textarea>
</div>

<div class="flex justify-end gap-2 mt-5">
    <button mat-flat-button color="medium" (click)="onClose()">
        Đóng
    </button>

    <button mat-flat-button color="primary" (click)="onConfirm()">
        <mat-icon class="icon-size-4" svgIcon="heroicons_outline:check"></mat-icon>
        <mat-label class="ml-2">Lưu cấu hình</mat-label>
    </button>
</div>
