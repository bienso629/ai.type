<h2 class="text-xl font-normal text-gray-500 flex items-center justify-self-stretch mb-4">
    <mat-icon class="icon-size-4" svgIcon="feather:file"></mat-icon>
    <mat-label class="ml-2">{{ 'app.bot_learns_document_content' | transloco }}</mat-label>
</h2>

<div class="grid grid-cols-2 gap-2 max-h-[260px] overflow-y-auto">
    <label *ngFor="let type of docTypes"
        class="flex items-center gap-2 p-2 border rounded cursor-pointer hover:bg-gray-100">
        <input type="radio" name="docType" [value]="type.value" [(ngModel)]="selectedDocType" />
        <span class="text-base">{{ type.label }}</span>
    </label>
</div>

<div class="flex justify-end gap-2 mt-5">
    <button mat-flat-button color="medium" (click)="onClose()">
        Đóng
    </button>

    <button mat-flat-button color="primary" (click)="onConfirm()">
        <mat-icon class="icon-size-4" svgIcon="feather:arrow-right"></mat-icon>
        <mat-label class="ml-2">{{ 'app.continue' | transloco }}</mat-label>
    </button>
</div>
