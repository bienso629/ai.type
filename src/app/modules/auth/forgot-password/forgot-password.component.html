<div class="flex flex-col sm:flex-row items-center md:items-start sm:justify-center md:justify-start flex-auto min-w-0">
    <div
        class="md:flex md:items-center md:justify-end w-full sm:w-auto md:h-full md:w-1/2 py-8 px-4 sm:p-12 md:p-16 sm:rounded-2xl md:rounded-none sm:shadow md:shadow-none">
        <div class="w-full max-w-80 sm:w-80 mx-auto sm:mx-0">
            <!-- Logo -->
            <div class="w-50 cursor-pointer" [routerLink]="['/']">
                <img src="assets/images/logo/typing-logo.svg">
            </div>

            <!-- Title -->
            <div class="mt-8 text-4xl font-extrabold tracking-tight leading-tight">Quên mật khẩu?</div>
            <div class="flex items-baseline mt-0.5 font-medium text-base">
                <div>Chưa có tài khoản?</div>
                <a class="ml-1 text-primary-500 hover:underline" [routerLink]="['/sign-up']">Đăng ký</a>
            </div>

            <!-- Alert -->
            <fuse-alert class="mt-8" *ngIf="showAlert" [appearance]="'outline'" [showIcon]="false" [type]="alert.type"
                [@shake]="alert.type === 'error'">
                {{alert.message}}
            </fuse-alert>

            <!-- Forgot password form -->
            <form class="mt-8" [formGroup]="forgotPasswordForm" #forgotPasswordNgForm="ngForm">

                <!-- Email field -->
                <mat-form-field class="w-full fuse-mat-dense fuse-mat-emphasized-affix">
                    <mat-label>Địa chỉ E-mail</mat-label>
                    <input id="email" matInput [formControlName]="'email'">
                    <mat-error *ngIf="forgotPasswordForm.get('email').hasError('required')">
                        Email address is required
                    </mat-error>
                    <mat-error *ngIf="forgotPasswordForm.get('email').hasError('email')">
                        Please enter a valid email address
                    </mat-error>
                </mat-form-field>

                <!-- Submit button -->
                <button class="fuse-mat-button-large w-full mt-3" mat-flat-button [color]="'primary'"
                    [disabled]="forgotPasswordForm.disabled" (click)="sendResetLink()">
                    <span *ngIf="!forgotPasswordForm.disabled">
                        Gửi Link khôi phục
                    </span>
                    <mat-progress-spinner *ngIf="forgotPasswordForm.disabled" [diameter]="24" [mode]="'indeterminate'"
                        [strokeWidth]="4"></mat-progress-spinner>
                </button>

                <!-- Form footer -->
                <div class="mt-8 text-md font-medium text-secondary">
                    <span>Quay lại</span>
                    <a class="ml-1 text-primary-500 hover:underline" [routerLink]="['/sign-in']">Đăng nhập
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div
        class="relative hidden md:flex flex-auto items-center justify-center w-1/2 h-full p-16 lg:px-28 overflow-hidden banner-2">
        <!-- @formatter:on -->
        <!-- Content -->
        <div class="z-10 relative w-full">
            <div class="text-7xl font-semibold leading-normal text-dark-100">
                <div><span class="bg-yellow-100 px-2">ai.type</span></div>
                <div><span class="bg-yellow-100 px-2">viết bài phải có AI</span></div>
            </div>
            <!-- <div class="mt-6 text-base tracking-tight leading-6 text-dark-400 max-w-2xl">
                ai.type là phần mềm hỗ trợ tạo content bằng văn bản, video, hình ảnh hoặc âm thanh
            </div> -->
            <div class="flex items-center mt-8">
                <div class="flex flex-0 items-center -space-x-1.5">
                    <img class="flex-0 w-10 h-10 rounded-full object-cover" src="assets/images/avatars/female-18.jpg">
                    <img class="flex-0 w-10 h-10 rounded-full object-cover" src="assets/images/avatars/female-11.jpg">
                    <img class="flex-0 w-10 h-10 rounded-full object-cover" src="assets/images/avatars/male-09.jpg">
                    <img class="flex-0 w-10 h-10 rounded-full object-cover" src="assets/images/avatars/male-16.jpg">
                </div>
                <div class="ml-4 text-base tracking-tight leading-6 text-gray-700">hơn 1k thành viên tham gia sử dụng
                    ai.type</div>
            </div>
        </div>
    </div>
</div>
