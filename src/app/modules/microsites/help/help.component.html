<div class="absolute inset-0 flex flex-col bg-white min-w-0 overflow-hidden">
    <!-- Header -->
    <div class="flex flex-row flex-0 items-center justify-between p-6">
        <div class="flex-1 flex-row shrink-0 items-center">
            <!-- Title -->
            <label class="uppercase text-primary font-semibold">
                {{ "app.auto_ai_type_software_user_guide" | transloco }}
            </label>
        </div>

        <!-- Actions -->
        <div class="flex flex-row shrink-0 items-center">
            <mat-icon
                class="icon-size-4 text-primary"
                svgIcon="feather:help-circle"
            ></mat-icon>
        </div>
    </div>

    <!-- Main -->
    <div class="flex-auto p-6 overflow-y-auto" cdkScrollable>
        <mat-accordion>
            @for (guide of guides; track guide) {
                <mat-expansion-panel class="mb-2">
                    <mat-expansion-panel-header>
                        <mat-panel-title class="font-base font-semibold">
                            {{ guide.title }}
                        </mat-panel-title>
                    </mat-expansion-panel-header>
                    <div
                        class="p-4 prose prose-sm max-w-none"
                        [innerHTML]="guide.html"
                    ></div>
                </mat-expansion-panel>
            }
        </mat-accordion>
    </div>
</div>
