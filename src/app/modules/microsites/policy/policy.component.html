<div class="absolute inset-0 flex flex-col bg-white min-w-0 overflow-hidden">
	<!-- Header -->
	<div class="flex flex-row flex-0 items-center justify-between p-6">
		<div class="flex-1 flex-row shrink-0 items-center">
			<!-- Title -->
			<label class="uppercase text-primary font-semibold">
				Hướng dẫn sử dụng phần mềm Ai.Type
			</label>
		</div>

		<!-- Actions -->
		<div class="flex flex-row shrink-0 items-center">
			<mat-icon class="icon-size-4 text-primary" svgIcon="feather:help-circle"></mat-icon>
		</div>
	</div>

	<!-- Main -->
	<div class="flex-auto px-6 pb-2 pt-2 overflow-y-auto" cdkScrollable>
		<mat-accordion>
			<mat-expansion-panel class="mb-2" hideToggle [expanded]="routerUrl.indexOf('/register') >= 0"
				(opened)="code = 'gAxcp3WfEzE'">
				<mat-expansion-panel-header>
					<mat-panel-title class="font-base">
						1. Đăng ký sử dụng phần mềm ai.type
					</mat-panel-title>
				</mat-expansion-panel-header>
				<p *ngIf="code === 'gAxcp3WfEzE'" class="p-3" [innerHTML]="code | youtube"></p>
			</mat-expansion-panel>

			<mat-expansion-panel class="mb-2" hideToggle [expanded]="routerUrl.indexOf('/dashboard') >= 0"
				(opened)="code = 'PqmwHobKyAg'">
				<mat-expansion-panel-header>
					<mat-panel-title class="font-base">
						2. Hướng dẫn tạo Văn bản đầu tiên
					</mat-panel-title>
				</mat-expansion-panel-header>
				<p *ngIf="code === 'PqmwHobKyAg'" class="p-3" [innerHTML]="code | youtube"></p>
			</mat-expansion-panel>

			<mat-expansion-panel class="mb-2" hideToggle [expanded]="routerUrl.indexOf('/ai-writer') >= 0"
				(opened)="code = 'gAxcp3WfEzE'">
				<mat-expansion-panel-header>
					<mat-panel-title class="font-base">
						3. Hướng dẫn tạo Văn bản hoàn chỉnh
					</mat-panel-title>
				</mat-expansion-panel-header>
				<p *ngIf="code === 'gAxcp3WfEzE'" class="p-3" [innerHTML]="code | youtube"></p>
			</mat-expansion-panel>
		</mat-accordion>
	</div>
</div>
