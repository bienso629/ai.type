<div class="policy-layout-page absolute inset-0 flex flex-col bg-white dark:bg-gray-900 min-w-0 overflow-y-auto">
    <!-- Header Topbar (no-print) -->
    <header class="no-print sticky top-0 z-50 px-6 py-4 flex items-center bg-white/95 dark:bg-gray-900/95">
        <button mat-icon-button (click)="goBack()" matTooltip="Quay lại" class="text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800">
            <mat-icon [svgIcon]="'feather:arrow-left'"></mat-icon>
        </button>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 md:px-8 pt-4 sm:pt-6 pb-2">
        <!-- Hero Banner -->
        <div class="bg-white dark:bg-gray-900 p-4 sm:p-6 md:p-8 mb-6">
            <div class="max-w-3xl">
                <div *ngIf="badgeText" class="inline-flex items-center gap-2 text-base font-semibold uppercase tracking-wider text-teal-600 dark:text-teal-400 mb-3">
                    <mat-icon class="icon-size-5" [svgIcon]="badgeIcon"></mat-icon>
                    <span>{{ badgeText }}</span>
                </div>
                <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 dark:text-white tracking-tight mb-4">
                    {{ title }}
                </h1>
                <p *ngIf="description" class="text-base text-gray-600 dark:text-gray-300 leading-relaxed mb-6">
                    {{ description }}
                </p>
                <div class="flex flex-wrap items-center gap-4 text-base text-gray-500 dark:text-gray-400 pt-3">
                    <span *ngIf="lastUpdated" class="flex items-center gap-1.5">
                        <mat-icon class="icon-size-4" [svgIcon]="'feather:calendar'"></mat-icon>
                        Cập nhật lần cuối: <strong>{{ lastUpdated }}</strong>
                    </span>
                    <span *ngIf="lastUpdated && version">•</span>
                    <span *ngIf="version" class="flex items-center gap-1.5">
                        <mat-icon class="icon-size-4" [svgIcon]="'feather:layers'"></mat-icon>
                        Phiên bản: <strong>{{ version }}</strong>
                    </span>
                    <span *ngIf="version && scope">•</span>
                    <span *ngIf="scope" class="flex items-center gap-1.5">
                        <mat-icon class="icon-size-4" [svgIcon]="'feather:globe'"></mat-icon>
                        Áp dụng: <strong>{{ scope }}</strong>
                    </span>
                </div>
            </div>
        </div>

        <!-- Layout Grid: Sidebar TOC + Policy Content -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- Sticky Sidebar (Table of Contents) -->
            <aside *ngIf="sections && sections.length > 0" class="no-print lg:col-span-4 sticky top-20">
                <div class="bg-gray-50 dark:bg-gray-850 p-5 rounded-2xl">
                    <h3 class="text-sm font-bold uppercase tracking-wider text-gray-400 dark:text-gray-500 mb-4 flex items-center gap-2">
                        <mat-icon class="icon-size-4" [svgIcon]="'feather:list'"></mat-icon>
                        <span>Mục lục điều khoản</span>
                    </h3>
                    <nav class="flex flex-col space-y-1">
                        <button *ngFor="let s of sections" (click)="scrollTo(s.id)"
                            class="text-left py-2.5 px-3.5 rounded-md transition-colors font-medium text-base text-gray-700 dark:text-gray-300 hover:bg-gray-200/60 dark:hover:bg-gray-700"
                            [ngClass]="{'!bg-blue-50 dark:!bg-blue-900/30 !text-blue-600 dark:!text-blue-400 font-semibold': activeSection === s.id}">
                            {{ s.title }}
                        </button>
                    </nav>

                    <div *ngIf="sidebarBadgeText" class="mt-6 pt-4">
                        <div class="flex items-center gap-2 text-base text-gray-500 dark:text-gray-400">
                            <mat-icon class="icon-size-5 text-emerald-500" [svgIcon]="sidebarBadgeIcon"></mat-icon>
                            <span>{{ sidebarBadgeText }}</span>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Policy Content Column -->
            <article [ngClass]="(sections && sections.length > 0) ? 'lg:col-span-8' : 'lg:col-span-12'" class="policy-content space-y-8 text-gray-800 dark:text-gray-200">
                <ng-content></ng-content>
            </article>
        </div>

        <!-- Footer note (Full width centered) -->
        <div class="w-full text-center pt-4 pb-2 mt-2 text-sm text-gray-400 dark:text-gray-500">
            AI.TYPE &copy; {{ currentYear }}. Bản quyền thuộc về Yên AI. Tất cả các quyền được bảo lưu.
        </div>
    </main>
</div>
