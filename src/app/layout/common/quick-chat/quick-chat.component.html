<div class="fixed lg:sticky top-0 bottom-0 lg:left-full w-full sm:w-[500px] lg:w-[64px] lg:h-screen lg:border-l">
    <div class="flex flex-col w-full sm:w-[500px] h-full transition-transform duration-400 ease-drawer bg-card"
        [ngClass]="{'-translate-x-full sm:-translate-x-[500px] lg:-translate-x-[436px] border-l': opened, 'translate-x-0': !opened}">

        <!-- Header -->
        <div class="quick-chat-header flex flex-0 items-center justify-start cursor-pointer" (click)="toggle()">
            <ng-container *ngIf="!opened">
                <div class="flex items-center py-3 px-3 border-b cursor-pointer hover:bg-gray-50 dark:hover:bg-hover">
                    <div class="relative flex flex-0 items-center justify-center w-10 h-10">
                        <mat-icon class="icon-size-5 text-primary transition-all cursor-pointer hover:scale-110"
                            title="Mở Quản lý Tools" [svgIcon]="'feather:grid'"></mat-icon>
                    </div>
                </div>
            </ng-container>

            <ng-container *ngIf="opened">
                <div class="flex flex-auto items-center ml-4">
                    <div class="text-lg font-medium leading-5">Web Tools</div>
                    <button class="ml-auto mr-4" mat-icon-button (click)="$event.stopPropagation(); close()">
                        <mat-icon [svgIcon]="'heroicons_outline:x'" class="icon-size-5"></mat-icon>
                    </button>
                </div>
            </ng-container>
        </div>

        <!-- Content -->
        <div class="flex flex-auto overflow-hidden border-t">
            <!-- Tools list (Left Sidebar) -->
            <div class="flex-0 w-16 h-full overflow-y-auto overscroll-y-contain sm:overflow-hidden sm:overscroll-auto"
                fuseScrollbar [fuseScrollbarOptions]="{wheelPropagation: false}">
                <div class="flex-auto">
                    <ng-container *ngFor="let tool of tools; trackBy: trackByFn">
                        <div class="flex items-center justify-center py-3 px-3 border-b cursor-pointer hover:bg-gray-50 dark:hover:bg-hover"
                            (click)="openTool(tool)" [title]="tool.name">
                            <div class="relative flex flex-0 w-8 h-8">
                                <img class="w-full h-full rounded-full object-cover border border-gray-200 p-0.5"
                                    [src]="getFavicon(tool.url)" [alt]="tool.name"
                                    onerror="this.src='./assets/images/logo/favicon.svg'" />
                            </div>
                        </div>
                    </ng-container>
                </div>
            </div>

            <!-- Form Area (Right Panel) -->
            <div class="flex flex-col flex-auto border-l overflow-hidden bg-gray-50 dark:bg-transparent">
                <div class="flex flex-col flex-auto p-6 overflow-y-auto">
                    <div class="mb-8">
                        <h2 class="text-xl font-semibold mb-2 text-secondary">Quản lý Web Tools</h2>
                        <p class="text-sm text-gray-500">Thêm các trang web thường xuyên sử dụng vào thanh tiện ích để
                            mở nhanh trên màn hình phụ.</p>
                    </div>

                    <!-- Tool Management List -->
                    <div class="bg-card rounded-2xl border overflow-hidden">
                        <div class="flex items-center px-4 py-3 bg-gray-50 border-b">
                            <span class="font-medium flex-auto">Danh sách hiện tại</span>
                            <button mat-icon-button color="primary" (click)="openAddDialog()"
                                matTooltip="Thêm công cụ mới">
                                <mat-icon class="icon-size-5">add_circle</mat-icon>
                            </button>
                        </div>
                        <div class="flex flex-col h-auto" cdkDropList (cdkDropListDropped)="drop($event)">
                            <ng-container *ngFor="let tool of tools">
                                <div cdkDrag class="flex items-center px-4 py-3 border-b last:border-none hover:bg-gray-50 cursor-move bg-white dark:bg-transparent">
                                    <img [src]="getFavicon(tool.url)" class="w-6 h-6 mr-3"
                                        onerror="this.src='./assets/images/logo/favicon.svg'" />
                                    <div class="flex-auto min-w-0">
                                        <div class="font-medium truncate">{{ tool.name }}</div>
                                        <div class="text-xs text-gray-500 truncate" dir="ltr">{{ tool.url }}</div>
                                    </div>
                                    <button mat-icon-button (click)="removeTool(tool.id)" matTooltip="Xoá">
                                        <mat-icon class="icon-size-5 text-red-400 hover:bg-red-500">delete</mat-icon>
                                    </button>
                                </div>
                            </ng-container>

                            <div *ngIf="tools.length === 0" class="p-4 text-center text-gray-500 italic">
                                Chưa có công cụ nào.
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-2 mt-4">
                        <button mat-flat-button color="primary" (click)="openLoginBrowser()" matTooltip="Mở trình duyệt riêng để đăng nhập Google">
                            Đăng Nhập
                        </button>
                        <button mat-flat-button color="warn" (click)="clearWebviewCookie()" matTooltip="Xoá toàn bộ Cookie & Session của Webview">
                            Xoá Cookie
                        </button>
                    </div>

                    <ng-template #addDialogTemplate>
                        <h2 class="text-lg p-0 py-3">Thêm công cụ mới</h2>
                        <mat-dialog-content class="p-0">
                            <mat-form-field class="w-full mt-2 mb-4 fuse-mat-dense fuse-mat-emphasized-affix"
                                [subscriptSizing]="'dynamic'">
                                <mat-label>Tên hiển thị</mat-label>
                                <input matInput [(ngModel)]="newToolName" placeholder="VD: Facebook, Capcut..." />
                            </mat-form-field>

                            <mat-form-field class="w-full mb-2 fuse-mat-dense fuse-mat-emphasized-affix"
                                [subscriptSizing]="'dynamic'">
                                <mat-label>Đường dẫn (URL)</mat-label>
                                <input matInput [(ngModel)]="newToolUrl" placeholder="https://..." />
                            </mat-form-field>
                        </mat-dialog-content>
                        <mat-dialog-actions align="end" class="p-0 mt-2 gap-2">
                            <button mat-button color="acent" mat-dialog-close>Hủy</button>
                            <button mat-flat-button color="primary" [disabled]="!newToolName || !newToolUrl"
                                (click)="saveTool()">
                                Thêm vào danh sách
                            </button>
                        </mat-dialog-actions>
                    </ng-template>

                </div>
            </div>
        </div>
    </div>
</div>
