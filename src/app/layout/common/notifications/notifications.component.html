<!-- Notifications toggle -->
<button mat-icon-button (click)="openPanel()" #notificationsOrigin>
    <ng-container *ngIf="budget > 0">
        <span class="absolute top-0 right-0 left-0 flex items-center justify-center h-3 z-10">
            <span
                class="flex items-center justify-center shrink-0 min-w-4 h-4 px-1 ml-4 mt-2.5 rounded-full bg-teal-600 text-indigo-50 text-xs font-medium">
                {{budget}}
            </span>
        </span>
    </ng-container>
    <mat-icon class="icon-size-5" [svgIcon]="'feather:inbox'" *ngIf="!processing"></mat-icon>
    <mat-progress-spinner [diameter]="20" [strokeWidth]="2" *ngIf="processing" [mode]="'indeterminate'"></mat-progress-spinner>
</button>

<!-- Notifications panel -->
<ng-template #notificationsPanel>
    <div
        class="fixed inset-0 sm:static sm:inset-auto flex flex-col sm:min-w-100 sm:w-100 overflow-hidden shadow-xl border-4 border-primary rounded-2xl">
        <!-- Header -->
        <div class="flex shrink-0 items-center p-6 py-2 bg-white text-black border-b">
            <div class="sm:hidden -ml-1 mr-3">
                <button mat-icon-button (click)="closePanel()">
                    <mat-icon class="icon-size-4 text-current" [svgIcon]="'heroicons_solid:x'"></mat-icon>
                </button>
            </div>

            <div class="text-lg font-medium leading-10">{{ (processing) ? 'Còn ' + budget + ' bài' : 'Thông báo'}}</div>

            <div class="ml-auto">
                <a mat-icon-button [matTooltip]="'Xem tất cả thông báo'" href="https://type.vn/notifications"
                    target="_blank" *ngIf="!processing" (click)="resumeProcessing()">
                    <mat-icon class="icon-size-5 text-current" [svgIcon]="'feather:mail'"></mat-icon>
                </a>

                <a mat-icon-button *ngIf="processing" (click)="stopProcessing()">
                    <mat-icon class="icon-size-5 text-current" [svgIcon]="'feather:x'"></mat-icon>
                </a>
            </div>
        </div>

        <!-- Content -->
        <div class="relative flex flex-col flex-auto sm:max-h-120 divide-y overflow-y-auto overflow-x-hidden bg-card">
            <!-- Notifications -->
            <ng-container *ngFor="let notification of notifications; trackBy: trackByFn">
                <div class="flex group hover:bg-gray-50 dark:hover:bg-black dark:hover:bg-opacity-5"
                    [ngClass]="{'unread': !notification.read}">
                    <!-- Notification with a link -->
                    <ng-container *ngIf="notification.link">
                        <!-- Normal links -->
                        <ng-container *ngIf="!notification.useRouter">
                            <a class="flex flex-auto py-5 pl-6 cursor-pointer" [href]="notification.link"
                                target="_blank">
                                <ng-container *ngTemplateOutlet="notificationContent"></ng-container>
                            </a>
                        </ng-container>
                        <!-- Router links -->
                        <ng-container *ngIf="notification.useRouter">
                            <a class="flex flex-auto py-5 pl-6 cursor-pointer" [routerLink]="notification.link">
                                <ng-container *ngTemplateOutlet="notificationContent"></ng-container>
                            </a>
                        </ng-container>
                    </ng-container>

                    <!-- Notification without a link -->
                    <ng-container *ngIf="!notification.link">
                        <div class="flex flex-auto py-5 pl-6">
                            <ng-container *ngTemplateOutlet="notificationContent"></ng-container>
                        </div>
                    </ng-container>

                    <!-- Actions -->
                    <div class="relative flex flex-col my-5 mr-6 ml-2">
                        <!-- Indicator -->
                        <button class="w-6 h-6 min-h-6" mat-icon-button (click)="toggleRead(notification)"
                            [matTooltip]="notification.read ? 'Mark as unread' : 'Mark as read'">
                            <span class="w-2 h-2 rounded-full" [ngClass]="{'bg-primary dark:bg-primary sm:opacity-0 sm:group-hover:opacity-100': notification.read,
                                            'bg-red-500': !notification.read}"></span>
                        </button>

                        <!-- Remove -->
                        <!-- <button class="w-6 h-6 min-h-6 sm:opacity-0 sm:group-hover:opacity-100" mat-icon-button
                            (click)="delete(notification)" [matTooltip]="'Remove'">
                            <mat-icon class="icon-size-4" [svgIcon]="'heroicons_solid:x'"></mat-icon>
                        </button> -->
                    </div>
                </div>

                <!-- Notification content template -->
                <ng-template #notificationContent>
                    <!-- Icon -->
                    <ng-container *ngIf="notification.icon && !notification.image">
                        <div
                            class="flex shrink-0 items-center justify-center w-8 h-8 mr-4 rounded-full bg-gray-100 dark:bg-gray-700">
                            <mat-icon class="icon-size-4" [svgIcon]="notification.icon">
                            </mat-icon>
                        </div>
                    </ng-container>

                    <!-- Image -->
                    <ng-container *ngIf="notification.image">
                        <img class="shrink-0 w-8 h-8 mr-4 rounded-full overflow-hidden object-cover object-center"
                            [src]="notification.image" [alt]="'Notification image'">
                    </ng-container>

                    <!-- Title, description & time -->
                    <div class="flex flex-col flex-auto">
                        <ng-container *ngIf="notification.title">
                            <mat-label class="font-bold line-clamp-1 text-lg">{{ notification.title }}</mat-label>
                        </ng-container>

                        <ng-container *ngIf="notification.description">
                            <mat-label class="line-clamp-2 max-w-50 text-md">{{ notification.description }}</mat-label>
                        </ng-container>

                        <div class="mt-2 text-sm leading-none text-secondary">
                            {{notification.time | date:'MMM dd, h:mm a'}}
                        </div>
                    </div>
                </ng-template>
            </ng-container>

            <!-- No notifications -->
            <ng-container *ngIf="!notifications || !notifications.length">
                <div class="flex flex-col flex-auto items-center justify-center sm:justify-start py-12 px-8">
                    <div
                        class="flex flex-0 items-center justify-center w-14 h-14 rounded-full bg-primary-100 dark:bg-primary-600">
                        <mat-icon class="text-primary-700 dark:text-primary-50"
                            [svgIcon]="'heroicons_outline:bell'"></mat-icon>
                    </div>
                    <div class="mt-5 text-2xl font-semibold tracking-tight">No notifications</div>
                    <div class="w-full max-w-60 mt-1 text-md text-center text-secondary">When you have notifications,
                        they will appear here.</div>
                </div>
            </ng-container>
        </div>
    </div>
</ng-template>
