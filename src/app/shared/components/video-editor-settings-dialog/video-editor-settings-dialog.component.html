<ng-container *transloco="let t">
    <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold m-0">Prompt tạo video</h2>
        <button mat-icon-button (click)="cancel()">
            <mat-icon
                class="icon-size-5"
                [svgIcon]="'heroicons_outline:x'"
            ></mat-icon>
        </button>
    </div>

    <mat-dialog-content
        class="flex flex-col gap-4 p-0 overflow-x-hidden scrollbar-hide !max-h-none"
        style="min-width: 350px"
    >
        <div class="flex flex-col gap-4">
            <div class="relative flex items-center w-full">
                <mat-form-field
                    class="w-full fuse-mat-dense field-hidden-subscript"
                >
                    <input
                        matInput
                        type="text"
                        [(ngModel)]="extraPrompt"
                        [ngClass]="
                            attachedVideoFiles.length > 0 ? 'pr-20' : 'pr-10'
                        "
                        [placeholder]="
                            'app.auto_for_example_follow_the_cyberpu'
                                | transloco
                        "
                    />
                </mat-form-field>

                <div class="absolute right-1 flex items-center">
                    <button
                        mat-icon-button
                        class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 w-8 h-8 min-h-8 flex items-center justify-center relative"
                        [matTooltip]="
                            'app.auto_attach_images_reference_docume'
                                | transloco
                        "
                        (click)="videoAttachment.click()"
                        [disabled]="isAnalyzing"
                    >
                        <mat-icon
                            class="icon-size-4"
                            [svgIcon]="'heroicons_outline:paper-clip'"
                        ></mat-icon>
                        @if (attachedVideoFiles.length > 0) {
                            <span
                                class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-semibold z-10"
                            >
                                {{ attachedVideoFiles.length }}
                            </span>
                        }

                        <input
                            #videoAttachment
                            type="file"
                            multiple
                            accept="image/*,.pdf,.txt,.md"
                            (change)="onVideoAttachmentSelected($event)"
                            class="hidden"
                            [title]="'app.auto_attached_document' | transloco"
                        />
                    </button>

                    @if (attachedVideoFiles.length > 0) {
                        <button
                            mat-icon-button
                            class="text-red-500 hover:bg-red-50 hover:text-red-600 w-8 h-8 min-h-8 flex items-center justify-center ml-1"
                            (click)="attachedVideoFiles = []"
                            [matTooltip]="
                                'app.auto_delete_attachment' | transloco
                            "
                        >
                            <mat-icon class="icon-size-4">close</mat-icon>
                        </button>
                    }
                </div>
            </div>

            <mat-form-field
                class="w-full field-hidden-subscript fuse-mat-dense"
            >
                <mat-select
                    [(ngModel)]="videoFormat"
                    [placeholder]="'app.auto_format' | transloco"
                >
                    <mat-option value="video">Video</mat-option>
                    <mat-option value="comic">{{ t("app.comic") }}</mat-option>
                    <mat-option value="slide">{{
                        t("app.slide_static")
                    }}</mat-option>
                    <mat-option value="podcast">Podcast</mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field
                class="w-full field-hidden-subscript fuse-mat-dense"
            >
                <mat-select
                    [(ngModel)]="aspectRatio"
                    [placeholder]="'app.auto_rate' | transloco"
                >
                    <mat-option value="16:9">16:9</mat-option>
                    <mat-option value="9:16">9:16</mat-option>
                    <mat-option value="4:3">4:3</mat-option>
                    <mat-option value="3:4">3:4</mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field
                class="w-full field-hidden-subscript fuse-mat-dense"
            >
                <mat-select
                    [(ngModel)]="maxDuration"
                    [placeholder]="t('app.duration')"
                >
                    <mat-option [value]="0">{{
                        "app.auto_freedom" | transloco
                    }}</mat-option>
                    <mat-option [value]="4">4s</mat-option>
                    <mat-option [value]="6">6s</mat-option>
                    <mat-option [value]="8">8s</mat-option>
                    <mat-option [value]="10">10s</mat-option>
                </mat-select>
            </mat-form-field>
        </div>
    </mat-dialog-content>

    <mat-dialog-actions class="p-0 mt-4 mb-0 flex-col gap-3">
        <button
            class="bg-green-500 text-white w-full m-0"
            (click)="submit('create')"
            mat-flat-button
            [disabled]="isAnalyzing"
        >
            @if (isAnalyzing) {
                <mat-icon
                    class="animate-spin icon-size-4 text-white"
                    [svgIcon]="'feather:loader'"
                ></mat-icon>
            }
            @if (!isAnalyzing) {
                <mat-icon class="icon-size-4 text-white">voice_chat</mat-icon>
            }
            <mat-label class="ml-2 text-white">
                {{ isAnalyzing ? "Đang phân tích..." : "Dựng video" }}
            </mat-label>
        </button>

        @if (hasVideoProject) {
            <button
                class="bg-blue-600 hover:bg-blue-700 text-white w-full m-0"
                (click)="submit('script')"
                mat-flat-button
            >
                <mat-icon
                    class="icon-size-4 text-white"
                    [svgIcon]="'heroicons_outline:document-text'"
                ></mat-icon>
                <mat-label class="ml-2 text-white">{{
                    "app.auto_script_1" | transloco
                }}</mat-label>
            </button>
        }
    </mat-dialog-actions>
</ng-container>
