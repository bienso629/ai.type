<div class="app-split-container" 
     [class.is-dragging]="isDragging"
     (mousemove)="onDrag($event)" 
     (mouseup)="stopDragging()" 
     [style.--webview-width]="(100 - leftPaneWidth) + 'vw'"
     [style.--main-pane-width]="leftPaneWidth + 'vw'"
     style="position: absolute; inset: 0; width: 100vw; height: 100vh;">
  
  <!-- Overlay chặn webview cướp chuột khi đang kéo -->
  <div *ngIf="isDragging" style="position: absolute; inset: 0; z-index: 999; cursor: col-resize;"></div>

  <!-- Cột chính: Ứng dụng gốc -->
  <div class="split-pane main-pane" [style.width.%]="leftPaneWidth" style="position: absolute; left: 0; top: 0; bottom: 0;">
    <router-outlet></router-outlet>
  </div>

  <!-- Nút tab Gemini - sát mép phải khi webview đang ẩn -->
  <div class="gemini-tab" [style.display]="isWebviewVisible ? 'none' : 'flex'" (click)="toggleWebview()">
    <span class="gemini-tab-icon">✦</span>
    <span class="gemini-tab-text">Gemini</span>
  </div>

  <!-- Vách ngăn ở giữa -->
  <div class="split-resizer" 
       [style.display]="isWebviewVisible ? 'block' : 'none'"
       (mousedown)="startDragging($event)" 
       [style.left.%]="leftPaneWidth" 
       style="position: absolute; top: 0; bottom: 0; z-index: 1000;">
  </div>

  <!-- Cột phụ: Gemini Webview -->
  <div class="split-pane webview-pane" 
       [style.left.%]="leftPaneWidth"
       [class.webview-hidden]="!isWebviewVisible"
       style="position: absolute; right: 0; top: 0; bottom: 0; padding-left: 6px;">
    
    <!-- Cụm nút công cụ ở giữa bên trên -->
    <div class="webview-toolbar" style="position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; gap: 8px; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 20px; backdrop-filter: blur(5px); pointer-events: auto;">
      <button (click)="clearWebviewCookie()" style="background: #ff4d4f; color: white; border: none; border-radius: 12px; padding: 4px 12px; cursor: pointer; font-weight: bold; font-size: 12px; outline: none;">Clear Cookie</button>
      <button (click)="toggleWebview()" style="background: #555; color: white; border: none; border-radius: 12px; padding: 4px 12px; cursor: pointer; font-weight: bold; font-size: 12px; outline: none;">Đóng</button>
    </div>

    <div class="webview-close-btn" (click)="toggleWebview()" title="Ẩn Gemini">✕</div>
    <div id="webview-container-div" style="width: 100%; height: 100%; border: none; display: flex; flex: 1; background: #1a1a1a;"></div>
  </div>
  
</div>
