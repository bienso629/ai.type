<body class="font-body-md text-on-background min-h-screen flex flex-col justify-center items-center">
<!-- Hero Decorative Section (Subtle Editorial Backdrop) -->
<div class="fixed inset-0 z-0 opacity-40 pointer-events-none overflow-hidden">

</div>
<!-- Main Content Canvas -->
<main class="relative z-10 w-full max-w-[480px] px-margin-mobile md:px-0 flex flex-col items-center">
<!-- Brand Identity -->
<header class="text-center mb-stack-lg animate-fade-in">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight mb-2">Atelier</h1>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Digital Content Studio</p>
</header>
<!-- Login Container -->
<div class="w-full bg-surface-container-lowest p-stack-lg ambient-whisper border border-[#E5E0D8] rounded-none">
<div class="mb-stack-md">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Chào mừng trở lại</h2>
<p class="font-body-md text-on-surface-variant italic">The art of management begins here.</p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-stack-md" method="POST" onsubmit="event.preventDefault();">
<!-- Username/Email -->
<div class="flex flex-col gap-unit">
<label class="font-label-md text-label-md text-on-surface-variant" for="username">Tên đăng nhập hoặc Email</label>
<div class="relative">
<input class="input-underlined w-full py-3 font-body-md text-on-surface placeholder:text-outline-variant" id="username" name="username" placeholder="editor@atelier.com" type="text"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-unit">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Mật khẩu</label>
<a class="font-label-sm text-label-sm text-secondary hover:text-on-secondary-container transition-colors" href="#">Quên mật khẩu?</a>
</div>
<div class="relative flex items-center">
<input class="input-underlined w-full py-3 font-body-md text-on-surface placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-0 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">visibility</span>
</button>
</div>
</div>
<!-- CAPTCHA Section (Refined UI Pattern) -->
<div class="bg-surface-container-low p-4 flex items-center justify-between border border-[#E5E0D8]">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-surface-container-highest flex items-center justify-center border border-outline-variant">
<span class="font-headline-md text-primary select-none">4</span>
</div>
<span class="font-body-md text-on-surface-variant">+</span>
<div class="w-10 h-10 bg-surface-container-highest flex items-center justify-center border border-outline-variant">
<span class="font-headline-md text-primary select-none">7</span>
</div>
<span class="font-body-md text-on-surface-variant">=</span>
</div>
<input class="w-16 text-center input-underlined font-headline-md text-primary py-1" maxlength="2" placeholder="?" type="text"/>
</div>
<!-- Action Button -->
<button class="w-full bg-primary text-on-primary py-4 px-6 font-label-md text-label-md uppercase tracking-widest hover:bg-surface-dim transition-all duration-300 flex items-center justify-center gap-2 group" type="submit">
                    Đăng nhập
                    <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_right_alt</span>
</button>
</form>
</div>
<!-- Footer Links -->
<footer class="mt-stack-md flex flex-col items-center gap-2">
<p class="font-body-md text-on-surface-variant">Bạn chưa có tài khoản?</p>
<a class="font-label-md text-label-md text-primary border-b border-primary pb-0.5 hover:border-secondary hover:text-secondary transition-all" href="#">Đăng ký ngay</a>
</footer>

<span class="material-symbols-outlined text-[16px]">arrow_back</span>
                Trở lại trang chủ Atelier
            </a>

</div>

<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('opacity-100');
            });
            input.addEventListener('blur', () => {
                if (!input.value) {
                    // subtle feedback if empty
                }
            });
        });

        // Simple password toggle logic
        const toggleBtn = document.querySelector('button[type="button"]');
        const passInput = document.getElementById('password');
        if(toggleBtn && passInput) {
            toggleBtn.addEventListener('click', () => {
                const isPass = passInput.type === 'password';
                passInput.type = isPass ? 'text' : 'password';
                toggleBtn.querySelector('span').innerText = isPass ? 'visibility_off' : 'visibility';
            });
        }
    </script>
