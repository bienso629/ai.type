<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom Editor Styles */
        .editor-content:empty:before {
            content: attr(data-placeholder);
            color: #858383; /* on-primary-container equivalent */
            pointer-events: none;
            display: block; /* For Firefox */
        }
        
        /* Subtly hide scrollbar for elegance */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e5e2de; /* surface-variant */
            border-radius: 4px;
        }
        
        /* Focus styles override */
        input:focus, textarea:focus, .editor-content:focus {
            outline: none;
            box-shadow: none;
        }

    body {
      min-height: max(884px, 100dvh);

<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col selection:bg-secondary-container selection:text-on-secondary-container">
<!-- TopAppBar -->
<header class="sticky top-0 z-50 bg-surface w-full border-b border-outline-variant flat no shadows flex justify-between items-center px-margin-mobile md:px-margin-desktop py-stack-sm transition-colors duration-200">
<div class="flex items-center gap-4">
<button aria-label="Go back" class="p-2 rounded-full hover:bg-surface-container-low transition-colors duration-200 text-on-surface-variant flex items-center justify-center active:opacity-80">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<span class="font-headline-md text-headline-md text-primary font-bold hidden md:block">Draft</span>
</div>
<div class="flex items-center gap-4">
<span class="text-on-surface-variant text-sm mr-2 hidden sm:inline">Saved just now</span>
<button class="bg-primary text-on-primary px-6 py-2 rounded font-label-md text-label-md hover:bg-inverse-surface transition-colors duration-200 active:opacity-80">
                Đăng bài
            </button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow w-full max-w-[800px] mx-auto px-margin-mobile md:px-0 py-stack-lg flex flex-col gap-stack-lg">
<!-- Writing Canvas -->
<article class="flex flex-col gap-stack-md w-full">
<!-- Title Input -->
<input class="w-full bg-transparent border-none p-0 font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary placeholder:text-on-surface-variant/50 focus:ring-0" placeholder="Tiêu đề bài viết..." type="text"/>
<!-- Content Area (Rich Text Simulation) -->
<div class="editor-content w-full min-h-[300px] bg-transparent font-body-lg text-body-lg text-on-surface leading-relaxed focus:outline-none" contenteditable="true" data-placeholder="Bắt đầu câu chuyện của bạn..."></div>
</article>
<!-- Divider -->
<hr class="border-t border-surface-container-high w-16 mx-auto my-stack-sm"/>
<!-- Post Settings Section -->
<section class="w-full bg-surface-container-lowest rounded-xl p-stack-md border border-outline-variant/30 relative overflow-hidden" style="box-shadow: 0px 12px 32px rgba(26, 26, 26, 0.02);">
<h2 class="font-label-md text-label-md text-on-surface tracking-widest uppercase mb-stack-md flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">tune</span>
                Thiết lập bài viết
            </h2>
<div class="flex flex-col gap-stack-md">
<!-- Category Dropdown -->
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase">Chuyên mục</label>
<div class="relative">
<select class="w-full appearance-none bg-surface border-b border-outline-variant/50 hover:border-outline-variant px-0 py-2 font-body-md text-body-md text-primary focus:ring-0 focus:border-secondary transition-colors duration-200 cursor-pointer">
<option disabled="" selected="" value="">Chọn chuyên mục...</option>
<option value="art">Nghệ thuật</option>
<option value="design">Thiết kế</option>
<option value="editorial">Xã luận</option>
<option value="journal">Nhật ký</option>
</select>
<span class="material-symbols-outlined absolute right-0 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<!-- Tags Input -->
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase">Thẻ (Tags)</label>
<input class="w-full bg-transparent border-b border-outline-variant/50 hover:border-outline-variant px-0 py-2 font-body-md text-body-md text-primary placeholder:text-on-surface-variant/50 focus:ring-0 focus:border-secondary transition-colors duration-200" placeholder="Thêm thẻ, phân cách bằng dấu phẩy..." type="text"/>
</div>
<!-- Featured Image Upload -->
<div class="flex flex-col gap-unit mt-stack-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase">Ảnh đại diện</label>
<button class="w-full h-48 border border-dashed border-outline-variant/50 rounded-lg flex flex-col items-center justify-center gap-2 bg-surface-container-low hover:bg-surface-container hover:border-outline-variant transition-all duration-300 group cursor-pointer">
<div class="h-10 w-10 rounded-full bg-surface flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">add_photo_alternate</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-primary transition-colors">Tải ảnh lên hoặc chọn từ thư viện</span>
<span class="font-label-sm text-label-sm text-on-surface-variant/70">Khuyến nghị: 1200 x 630px</span>
</button>
</div>
</div>
</section>
</main>
<script>
        // Simple script to handle editor placeholder visibility based on content
        const editor = document.querySelector('.editor-content');
        
        editor.addEventListener('input', function() {
            if (this.textContent.trim() === '') {
                this.innerHTML = ''; // Clear br tags or other artifacts when seemingly empty
            }
        });
    </script>
