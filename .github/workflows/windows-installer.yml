name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # Không có chứng chỉ ký số trên CI -> bỏ qua bước ký để không lỗi
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python (đóng gói edge-tts)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Script obfuscate dùng mkdir -p / cp -r nên npm phải chạy script bằng bash thay vì cmd
      - name: Use bash for npm scripts
        run: npm config set script-shell "C:\\Program Files\\Git\\bin\\bash.exe"

      - name: Install dependencies & Build Angular
        run: |
          npm install
          npm run build:frontend

      - name: Install Electron dependencies
        working-directory: electron
        run: npm install

      # Các binary đi kèm (extraResources) không được commit vào git -> tải / build trên CI
      - name: Download ffmpeg & yt-dlp
        working-directory: electron
        run: |
          curl -fsSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -q ffmpeg.zip -d ffmpeg_tmp
          cp ffmpeg_tmp/*/bin/ffmpeg.exe ffmpeg-win.exe
          rm -rf ffmpeg.zip ffmpeg_tmp
          curl -fsSL -o yt-dlp-win.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          mkdir -p bin
          ls -la *.exe

      - name: Build edge-tts-win.exe
        working-directory: electron
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts pyinstaller
          printf 'from edge_tts.util import main\nif __name__ == "__main__":\n    main()\n' > edge_tts_entry.py
          pyinstaller --onefile --name edge-tts-win edge_tts_entry.py
          cp dist/edge-tts-win.exe edge-tts-win.exe
          rm -rf build dist/edge-tts-win.exe edge_tts_entry.py edge-tts-win.spec

      - name: Obfuscate Electron source
        working-directory: electron
        run: npm run obfuscate

      - name: Build NSIS installer
        working-directory: electron
        run: npx electron-builder --win --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI.Type-Windows-Setup-${{ github.run_number }}
          path: |
            electron/dist/*.exe
            electron/dist/latest.yml
          if-no-files-found: error
          retention-days: 14
