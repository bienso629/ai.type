name: Build Ubuntu Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python (đóng gói edge-tts)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies for AppImage/deb
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 rpm fakeroot dpkg

      - name: Install dependencies & Build Angular
        run: |
          npm install
          npm run build:frontend

      - name: Install Electron dependencies
        working-directory: electron
        run: npm install

      - name: Download ffmpeg & yt-dlp for Linux
        working-directory: electron
        run: |
          curl -fsSL -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p ffmpeg_tmp
          tar -xf ffmpeg.tar.xz -C ffmpeg_tmp
          cp ffmpeg_tmp/*/bin/ffmpeg ffmpeg-linux
          chmod +x ffmpeg-linux
          rm -rf ffmpeg.tar.xz ffmpeg_tmp
          curl -fsSL -o yt-dlp-linux https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          chmod +x yt-dlp-linux
          mkdir -p bin
          ls -la ffmpeg-linux yt-dlp-linux

      - name: Build edge-tts-linux
        working-directory: electron
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts pyinstaller
          printf 'from edge_tts.util import main\nif __name__ == "__main__":\n    main()\n' > edge_tts_entry.py
          pyinstaller --onefile --name edge-tts-linux edge_tts_entry.py
          cp dist/edge-tts-linux edge-tts-linux
          chmod +x edge-tts-linux
          rm -rf build dist/edge-tts-linux edge_tts_entry.py edge-tts-linux.spec

      - name: Obfuscate Electron source
        working-directory: electron
        run: npm run obfuscate

      - name: Build Ubuntu/Linux installer (.deb, .AppImage)
        working-directory: electron
        run: npx electron-builder --linux --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI.Type-Ubuntu-Installer-${{ github.run_number }}
          path: |
            electron/dist/*.deb
            electron/dist/*.AppImage
            electron/dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 14
