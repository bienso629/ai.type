pipelines:
  custom:
    build-all-apps:
      - parallel:
          - step:
              name: Build for Linux
              image: node:22
              script:
                - npm install
                - npm run build
                - cd electron
                - npm install
                - npm run build:linux
              artifacts:
                - electron/dist/*.AppImage
                - electron/dist/*.deb

          - step:
              name: Build for Windows
              runs-on: windows
              script:
                - npm install
                - npm run build
                - cd electron
                - npm install
                - npm run build:win
              artifacts:
                - electron/dist/*.exe

          - step:
              name: Build for macOS
              runs-on: macos
              script:
                - npm install
                - npm run build
                - cd electron
                - npm install
                - npm run build:mac
              artifacts:
                - electron/dist/*.dmg

          - step:
              name: Build for iOS (iPad / iPhone)
              runs-on: macos
              script:
                - npm install
                - npm run build:frontend
                - npx cap sync ios
                - cd ios/App
                - xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO archive
                - mkdir -p build/Payload
                - cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
                - cd build && zip -r App-unsigned.ipa Payload
              artifacts:
                - ios/App/build/App-unsigned.ipa
                - ios/App/build/App.xcarchive/**

    build-ios:
      - step:
          name: Build iOS Native App
          runs-on: macos
          script:
            - npm install
            - npm run build:frontend
            - npx cap sync ios
            - cd ios/App
            - xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO archive
            - mkdir -p build/Payload
            - cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
            - cd build && zip -r App-unsigned.ipa Payload
          artifacts:
            - ios/App/build/App-unsigned.ipa
            - ios/App/build/App.xcarchive/**

    upload-testflight:
      - step:
          name: Build and Upload to TestFlight
          runs-on: macos
          script:
            - npm install
            - npm run build:frontend
            - npx cap sync ios
            - cd ios/App
            - xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive
            - xcrun altool --upload-app -f build/App.xcarchive/Products/Applications/App.app -t ios --apiKey "$APP_STORE_KEY_ID" --apiIssuer "$APP_STORE_ISSUER_ID" || true
          artifacts:
            - ios/App/build/App.xcarchive/**
