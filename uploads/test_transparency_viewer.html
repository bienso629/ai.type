<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Kiểm tra Video Trong Suốt Trực Quan</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #1e1e2e;
            color: #fff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            position: relative;
            width: 360px;
            height: 640px;
            border: 4px solid #ffcc00;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-top: 20px;
        }
        /* Lớp 1: Nền động có ô bàn cờ và hoạt ảnh cầu vồng */
        .background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #ff007f, #7928ca, #0070f3, #00dfd8);
            background-size: 400% 400%;
            animation: gradientBG 6s ease infinite;
            z-index: 1;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* Lớp 2: Dòng chữ đồ họa chuyển động ở giữa */
        .middle-text {
            position: absolute;
            top: 45%;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 4px 10px rgba(0,0,0,0.8);
            z-index: 2;
        }
        /* Lớp 3: Video trong suốt đè lên trên cùng */
        .transparent-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 3;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 18px;
            background: #0070f3;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #0051b3;
        }
    </style>
</head>
<body>
    <h2>TRÌNH KIỂM CHỨNG ĐỘ TRONG SUỐT THỰC TẾ (NATIVE ALPHA VIEWER)</h2>
    <p>Nếu video trong suốt, bạn sẽ thấy <b>người đi lại</b> đè lên dòng chữ và nền cầu vồng đang đổi màu phía sau.</p>
    
    <div class="container">
        <!-- Lớp 1: Nền chuyển động đổi màu -->
        <div class="background-layer" id="bgLayer"></div>
        
        <!-- Lớp 2: Chữ nằm sau lưng người -->
        <div class="middle-text">ĐÂY LÀ LỚP NỀN<br>PHÍA DƯỚI NGƯỜI</div>
        
        <!-- Lớp 3: Video WebM có kênh Alpha trong suốt -->
        <video class="transparent-video" autoplay loop muted playsinline>
            <source src="video_layers_output/layer2_foreground_person_transparent_vp8.webm" type="video/webm">
            <source src="video_layers_output/layer2_foreground_person_transparent_vp9.webm" type="video/webm">
            Trình duyệt của bạn không hỗ trợ video HTML5.
        </video>
    </div>

    <div class="controls">
        <button onclick="setBg('gradient')">Nền Cầu Vồng</button>
        <button onclick="setBg('checker')">Nền Ca-rô Trong Suốt</button>
        <button onclick="setBg('image')">Nền Bức Tranh Thư Viện Gốc</button>
    </div>

    <script>
        function setBg(type) {
            const bg = document.getElementById('bgLayer');
            if (type === 'gradient') {
                bg.style.background = 'linear-gradient(45deg, #ff007f, #7928ca, #0070f3, #00dfd8)';
                bg.style.backgroundSize = '400% 400%';
                bg.style.animation = 'gradientBG 6s ease infinite';
            } else if (type === 'checker') {
                bg.style.animation = 'none';
                bg.style.background = 'repeating-conic-gradient(#808080 0% 25%, #fff 0% 50%) 50% / 20px 20px';
            } else if (type === 'image') {
                bg.style.animation = 'none';
                bg.style.background = 'url("video_layers_output/layer1_background_pristine.png") center/cover no-repeat';
            }
        }
    </script>
</body>
</html>
